<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Relevé</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16202B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Relevé">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --ink:#16202B;
  --ink-2:#42525F;
  --ink-3:#7B8A95;
  --panel:#E7EDEB;
  --surface:#FFFFFF;
  --line:#CFD9D7;
  --line-soft:#E2E9E7;
  --teal:#1F7A6B;
  --teal-soft:#E2F0ED;
  --indigo:#2E4A6B;
  --amber:#C97F0A;
  --amber-soft:#FBF0DC;
  --alert:#B93F2B;
  --alert-soft:#F8E5E1;
  --r:14px;
  --pad:16px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--panel);
  color:var(--ink);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(70px + var(--safe-b));
  overscroll-behavior-y:contain;
}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}

/* ---------- typographic system ---------- */
.eyebrow{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ink-3);
  font-weight:600;
}
.readout{
  font-family:var(--mono);
  font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;
  font-weight:600;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:30;
  background:var(--ink);
  color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) var(--pad) 12px;
}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar button.nav{
  width:34px;height:34px;border-radius:10px;
  background:rgba(255,255,255,.1);color:#fff;
  display:grid;place-items:center;font-size:17px;flex:none;
}
.monthbar button.nav:active{background:rgba(255,255,255,.22)}
.monthlabel{text-align:center;flex:1;min-width:0}
.monthlabel .m{font-size:17px;font-weight:650;letter-spacing:-.01em;text-transform:capitalize}
.monthlabel .sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:1px}

/* ---------- layout ---------- */
main{padding:14px var(--pad) 8px;max-width:620px;margin:0 auto}
.card{
  background:var(--surface);
  border:1px solid var(--line-soft);
  border-radius:var(--r);
  padding:14px;
  margin-bottom:12px;
}
.card > .eyebrow{margin-bottom:10px;display:block}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-title .act{font-size:13px;font-weight:600;color:var(--indigo)}

/* ---------- gauge (signature) ---------- */
.gauge-card{padding:16px 14px 14px}
.bigline{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 0 14px}
.big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:40px;font-weight:650;letter-spacing:-.035em;line-height:1}
.big.neg{color:var(--alert)}
.perday{text-align:right;flex:none}
.perday .v{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.perday .l{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

.scale{position:relative;height:34px;margin-bottom:8px}
.track{
  position:absolute;left:0;right:0;top:0;height:16px;
  background:var(--panel);border-radius:4px;overflow:hidden;
  border:1px solid var(--line);
}
.fill{
  height:100%;width:0;
  background:var(--teal);
  transition:width .7s cubic-bezier(.22,.8,.3,1),background-color .3s;
}
.fill.warn{background:var(--amber)}
.fill.over{background:var(--alert)}
.pace{
  position:absolute;top:-3px;width:2px;height:22px;background:var(--ink);
  transition:left .7s cubic-bezier(.22,.8,.3,1);
}
.pace::after{
  content:"";position:absolute;left:-3px;top:-4px;
  border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid var(--ink);
}
.pacelabel{
  position:absolute;top:20px;font-family:var(--mono);font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);
  white-space:nowrap;
  transition:left .7s cubic-bezier(.22,.8,.3,1);
}
.ticks{position:absolute;left:0;right:0;top:16px;height:5px}
.ticks i{position:absolute;top:0;width:1px;height:4px;background:var(--line)}
.verdict{
  font-size:13px;line-height:1.4;color:var(--ink-2);
  border-top:1px solid var(--line-soft);padding-top:10px;margin-top:4px;
}
.verdict b{color:var(--ink);font-weight:650}

/* ---------- readouts grid ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);border-radius:var(--r);overflow:hidden;border:1px solid var(--line-soft);margin-bottom:12px}
.ro{background:var(--surface);padding:12px 13px}
.ro .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.ro .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:650;letter-spacing:-.02em;margin-top:3px}
.ro .h{font-size:11px;color:var(--ink-3);margin-top:1px}
.v.pos{color:var(--teal)} .v.neg{color:var(--alert)} .v.wait{color:var(--amber)}

/* ---------- rows ---------- */
.row{
  display:flex;align-items:center;gap:11px;
  padding:11px 0;border-top:1px solid var(--line-soft);
}
.row:first-of-type{border-top:0}
.row .body{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:520;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.row .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;flex:none}
.row.done .t,.row.done .amt{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}

.chk{
  width:26px;height:26px;flex:none;border-radius:8px;
  border:1.5px solid var(--line);background:var(--surface);
  display:grid;place-items:center;color:transparent;font-size:14px;font-weight:700;
  transition:.15s;
}
.chk.on{background:var(--teal);border-color:var(--teal);color:#fff}
.day{
  width:30px;flex:none;text-align:center;
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-2);
  background:var(--panel);border-radius:7px;padding:4px 0;line-height:1.15;
}
.day small{display:block;font-size:8px;letter-spacing:.08em;color:var(--ink-3);font-weight:600}

/* ---------- category bars ---------- */
.cat{margin-bottom:11px}
.cat:last-child{margin-bottom:0}
.cat .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
.cat .top .n{font-weight:520}
.cat .top .a{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:6px;background:var(--panel);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--indigo);border-radius:3px;transition:width .6s}

/* ---------- empty ---------- */
.empty{
  text-align:center;padding:22px 10px;color:var(--ink-3);font-size:14px;line-height:1.5;
}
.empty b{display:block;color:var(--ink-2);font-weight:600;margin-bottom:3px}

/* ---------- buttons ---------- */
.btn{
  display:block;width:100%;text-align:center;
  padding:13px;border-radius:11px;font-size:15px;font-weight:600;
  background:var(--ink);color:#fff;
}
.btn:active{opacity:.8}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn.danger{background:var(--alert-soft);color:var(--alert)}
.btn.sm{padding:10px;font-size:14px}
.btnrow{display:flex;gap:8px}
.btnrow>*{flex:1}

/* ---------- fab ---------- */
.fab{
  position:fixed;right:16px;bottom:calc(78px + var(--safe-b));z-index:35;
  width:56px;height:56px;border-radius:19px;
  background:var(--ink);color:#fff;font-size:26px;font-weight:300;
  display:grid;place-items:center;
  box-shadow:0 6px 20px rgba(22,32,43,.28);
}
.fab:active{transform:scale(.94)}

/* ---------- tabbar ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--line);
  display:flex;padding-bottom:var(--safe-b);
}
nav button{
  flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-3);
}
nav button .ic{font-size:19px;line-height:1}
nav button .lb{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
nav button.on{color:var(--ink)}

/* ---------- sheet ---------- */
.scrim{
  position:fixed;inset:0;z-index:50;background:rgba(22,32,43,.4);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;
  background:var(--surface);
  border-radius:20px 20px 0 0;
  padding:8px var(--pad) calc(18px + var(--safe-b));
  max-height:92vh;overflow-y:auto;
  transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.9,.35,1);
  box-shadow:0 -8px 30px rgba(22,32,43,.16);
}
.sheet.open{transform:translateY(0)}
.handle{width:36px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h2{font-size:18px;font-weight:650;letter-spacing:-.015em;margin:0 0 14px}
.f{margin-bottom:12px}
.f label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;font-weight:600}
.f input,.f select{
  width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);font-size:16px;
}
.f input:focus,.f select:focus{outline:2px solid var(--indigo);outline-offset:-1px;border-color:var(--indigo)}
.f input.money{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.seg{display:flex;gap:6px}
.seg button{
  flex:1;padding:11px;border-radius:10px;background:var(--panel);
  font-size:14px;font-weight:600;color:var(--ink-2);
}
.seg button.on{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{
  padding:8px 12px;border-radius:999px;background:var(--panel);
  font-size:13.5px;font-weight:520;
}
.chips button.on{background:var(--ink);color:#fff}

/* ---------- misc ---------- */
.banner{
  background:var(--amber-soft);color:#6B4405;border:1px solid #EBD8AE;
  border-radius:11px;padding:10px 12px;font-size:12.5px;line-height:1.45;margin-bottom:12px;
}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:8px}
.total-line{
  display:flex;justify-content:space-between;align-items:baseline;
  padding-top:11px;margin-top:4px;border-top:1.5px solid var(--ink);
  font-weight:650;
}
.total-line .a{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px}
.toast{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,14px);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:11px;
  font-size:13.5px;font-weight:520;z-index:60;opacity:0;pointer-events:none;transition:.25s;
  max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="monthbar">
    <button class="nav" id="prevM" aria-label="Mois précédent">‹</button>
    <div class="monthlabel">
      <div class="m" id="mLabel">—</div>
      <div class="sub" id="mSub">—</div>
    </div>
    <button class="nav" id="nextM" aria-label="Mois suivant">›</button>
  </div>
</header>

<main id="view"></main>

<button class="fab" id="fab" aria-label="Ajouter une dépense">+</button>

<nav>
  <button data-tab="releve" class="on"><span class="ic">◔</span><span class="lb">Relevé</span></button>
  <button data-tab="mois"><span class="ic">≡</span><span class="lb">Le mois</span></button>
  <button data-tab="epargne"><span class="ic">▣</span><span class="lb">Épargne</span></button>
  <button data-tab="reglages"><span class="ic">⚙</span><span class="lb">Réglages</span></button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="handle"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const KEY = "budget.releve.v1";
const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

/* =========================================================
   Persistance : localStorage, puis stockage d'aperçu, puis mémoire
   ========================================================= */
let storeMode = "local";
const Store = {
  async load(){
    try{ const v = localStorage.getItem(KEY); if(v!==null){ storeMode="local"; return JSON.parse(v);} }catch(e){}
    if(window.storage){
      try{ const r = await window.storage.get(KEY); if(r && r.value){ storeMode="preview"; return JSON.parse(r.value);} }catch(e){}
    }
    try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); storeMode="local"; }
    catch(e){ storeMode = window.storage ? "preview" : "memory"; }
    return null;
  },
  async save(data){
    const s = JSON.stringify(data);
    try{ localStorage.setItem(KEY,s); storeMode="local"; return; }catch(e){}
    if(window.storage){ try{ await window.storage.set(KEY,s); storeMode="preview"; return; }catch(e){} }
    storeMode="memory";
  }
};

/* =========================================================
   État
   ========================================================= */
const DEFAULT_CATS = ["Courses","Restaurant","Carburant","Transport","Santé","Vêtements","Loisirs","Maison","Cadeaux","Beauté","Enfant","Voyage","Divers"];

function blank(){
  return {
    v:1,
    categories: DEFAULT_CATS.slice(),
    incomeTemplate: [],
    fixedTemplate: [],
    accounts: [],
    months: {}
  };
}
let S = blank();
let cur = ymNow();
let tab = "releve";

function ymNow(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function ymShift(ym,n){
  let [y,m]=ym.split("-").map(Number); m+=n;
  while(m>12){m-=12;y++;} while(m<1){m+=12;y--;}
  return y+"-"+String(m).padStart(2,"0");
}
function ymParts(ym){ const [y,m]=ym.split("-").map(Number); return {y,m}; }
function daysIn(ym){ const {y,m}=ymParts(ym); return new Date(y,m,0).getDate(); }
function uid(){ return Math.random().toString(36).slice(2,10); }

let saveT=null;
function persist(){ clearTimeout(saveT); saveT=setTimeout(()=>Store.save(S),180); }

function month(ym){
  if(!S.months[ym]){
    S.months[ym] = {
      incomes: S.incomeTemplate.map(t=>({id:uid(),tplId:t.id,label:t.label,amount:t.amount,got:false})),
      fixed:   S.fixedTemplate.map(t=>({id:uid(),tplId:t.id,label:t.label,amount:t.amount,day:t.day,category:t.category,paid:false})),
      expenses: [],
      moves: []
    };
    persist();
  }
  return S.months[ym];
}

/* =========================================================
   Formatage
   ========================================================= */
const nf = new Intl.NumberFormat("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0});
function eur(n){ return nf.format(n||0)+" €"; }
function eur0(n){ return nf0.format(Math.round(n||0))+" €"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* =========================================================
   Calculs du mois
   ========================================================= */
function stats(ym){
  const M = month(ym);
  const inTot   = M.incomes.reduce((a,x)=>a+(+x.amount||0),0);
  const inGot   = M.incomes.filter(x=>x.got).reduce((a,x)=>a+(+x.amount||0),0);
  const fixTot  = M.fixed.reduce((a,x)=>a+(+x.amount||0),0);
  const fixPaid = M.fixed.filter(x=>x.paid).reduce((a,x)=>a+(+x.amount||0),0);
  const varTot  = M.expenses.reduce((a,x)=>a+(+x.amount||0),0);
  const savIn   = M.moves.filter(x=>x.kind==="in").reduce((a,x)=>a+(+x.amount||0),0);
  const savOut  = M.moves.filter(x=>x.kind==="out").reduce((a,x)=>a+(+x.amount||0),0);
  const savNet  = savIn - savOut;
  const budget  = inTot - fixTot - savNet;      // enveloppe dépenses courantes
  const reste   = budget - varTot;
  return {inTot,inGot,fixTot,fixPaid,fixDue:fixTot-fixPaid,varTot,savIn,savOut,savNet,budget,reste};
}
function savingsTotal(){
  let t = (S.accounts||[]).reduce((a,x)=>a+(+x.initial||0),0);
  for(const ym in S.months){
    for(const mv of S.months[ym].moves) t += (mv.kind==="in"?1:-1)*(+mv.amount||0);
  }
  return t;
}
function accountBalance(id){
  let t = (+((S.accounts.find(a=>a.id===id)||{}).initial)||0);
  for(const ym in S.months){
    for(const mv of S.months[ym].moves) if(mv.accountId===id) t += (mv.kind==="in"?1:-1)*(+mv.amount||0);
  }
  return t;
}

/* =========================================================
   Rendu
   ========================================================= */
const view = document.getElementById("view");

function render(){
  const {y,m} = ymParts(cur);
  document.getElementById("mLabel").textContent = MONTHS[m-1]+" "+y;
  document.getElementById("mSub").textContent = cur===ymNow() ? "mois en cours" : "relevé archivé";
  document.getElementById("fab").style.display = (tab==="reglages") ? "none" : "grid";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  view.innerHTML = ({releve:vReleve, mois:vMois, epargne:vEpargne, reglages:vReglages})[tab]();
  window.scrollTo(0,0);
  if(tab==="releve") requestAnimationFrame(drawGauge);
}

function storeBanner(){
  if(storeMode==="local") return "";
  if(storeMode==="preview") return `<div class="banner">Tu es en aperçu. Les données sont conservées dans cette conversation, pas sur le téléphone. Installe l'app sur l'écran d'accueil pour qu'elles vivent sur l'iPhone.</div>`;
  return `<div class="banner">Le stockage du navigateur est bloqué. Les données disparaîtront en fermant l'onglet. Vérifie que la navigation privée est désactivée.</div>`;
}

/* ---------- Relevé ---------- */
function vReleve(){
  const st = stats(cur);
  const M  = month(cur);
  const nothing = st.inTot===0 && st.fixTot===0 && st.varTot===0;

  if(nothing && Object.keys(S.months).length<=1 && S.incomeTemplate.length===0){
    return storeBanner()+`
    <div class="card">
      <span class="eyebrow">Premier démarrage</span>
      <div class="empty" style="text-align:left;padding:4px 0 10px">
        <b>Rien à mesurer pour l'instant.</b>
        Commence par déclarer ce qui revient chaque mois : ton salaire, tes prélèvements et tes abonnements. Ils seront ensuite reportés automatiquement sur chaque nouveau mois.
      </div>
      <button class="btn" onclick="go('reglages')">Configurer mes revenus et prélèvements</button>
    </div>`;
  }

  const dim = daysIn(cur);
  const today = new Date();
  const isCur = cur===ymNow();
  const dayNo = isCur ? today.getDate() : dim;
  const pacePct = Math.min(100, (dayNo/dim)*100);
  const usedPct = st.budget>0 ? Math.min(100,(st.varTot/st.budget)*100) : (st.varTot>0?100:0);
  const daysLeft = Math.max(0, dim-dayNo);
  const perDay = daysLeft>0 ? st.reste/daysLeft : st.reste;

  // verdict
  let verdict;
  if(st.budget<=0){
    verdict = `Les entrées ne couvrent pas encore les charges fixes de ce mois. Vérifie tes revenus dans <b>Le mois</b>.`;
  }else if(st.reste<0){
    verdict = `Tu as dépassé l'enveloppe de <b>${eur0(-st.reste)}</b>. La différence sortira de l'épargne si rien ne change.`;
  }else if(isCur){
    const expected = st.budget*(dayNo/dim);
    const gap = expected - st.varTot;
    verdict = gap>=0
      ? `Au ${dayNo} du mois tu es <b>en dessous de la cadence</b> de ${eur0(gap)}. Il reste ${daysLeft} jour${daysLeft>1?"s":""}.`
      : `Au ${dayNo} du mois tu es <b>en avance sur la cadence</b> de ${eur0(-gap)}. Il reste ${daysLeft} jour${daysLeft>1?"s":""}.`;
  }else{
    verdict = `Mois clôturé avec <b>${eur0(st.reste)}</b> non dépensés sur l'enveloppe courante.`;
  }

  // ticks tous les 7 jours
  let ticks="";
  for(let d=7; d<dim; d+=7) ticks += `<i style="left:${(d/dim)*100}%"></i>`;

  // catégories
  const byCat = {};
  M.expenses.forEach(e=>{ byCat[e.category||"Divers"] = (byCat[e.category||"Divers"]||0)+(+e.amount||0); });
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat = cats.length?cats[0][1]:1;

  const upcoming = M.fixed.filter(f=>!f.paid).sort((a,b)=>(a.day||99)-(b.day||99)).slice(0,5);

  return storeBanner()+`
  <div class="card gauge-card">
    <span class="eyebrow">Reste à vivre</span>
    <div class="bigline">
      <div class="big ${st.reste<0?"neg":""}">${eur(st.reste)}</div>
      ${isCur&&daysLeft>0?`<div class="perday"><div class="v">${eur0(perDay)}</div><div class="l">par jour</div></div>`:``}
    </div>
    <div class="scale">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="ticks">${ticks}</div>
      ${isCur?`<div class="pace" id="pace" style="left:${pacePct}%"></div>
      <div class="pacelabel" style="left:${pacePct}%;transform:translateX(${pacePct>76?-92:pacePct<14?-8:-50}%)">cadence · j${dayNo}</div>`:``}
    </div>
    <div class="verdict" style="margin-top:${isCur?14:2}px">${verdict}</div>
    <input type="hidden" id="usedPct" value="${usedPct}">
  </div>

  <div class="grid2">
    <div class="ro"><div class="l">Entrées</div><div class="v pos">${eur0(st.inTot)}</div>
      <div class="h">${st.inGot<st.inTot?eur0(st.inTot-st.inGot)+" à recevoir":"tout est arrivé"}</div></div>
    <div class="ro"><div class="l">Charges fixes</div><div class="v">${eur0(st.fixTot)}</div>
      <div class="h">${st.fixDue>0?eur0(st.fixDue)+" à venir":"tout est prélevé"}</div></div>
    <div class="ro"><div class="l">Dépenses courantes</div><div class="v">${eur0(st.varTot)}</div>
      <div class="h">${M.expenses.length} saisie${M.expenses.length>1?"s":""}</div></div>
    <div class="ro"><div class="l">Mis de côté</div><div class="v ${st.savNet>0?"pos":st.savNet<0?"neg":""}">${eur0(st.savNet)}</div>
      <div class="h">${st.savOut>0?eur0(st.savOut)+" repris":"total "+eur0(savingsTotal())}</div></div>
  </div>

  ${upcoming.length?`
  <div class="card">
    <div class="sec-title"><span class="eyebrow">Prélèvements attendus</span>
      <button class="act" onclick="go('mois')">Tout voir</button></div>
    ${upcoming.map(f=>`
      <div class="row">
        <div class="day">${f.day||"?"}<small>${MONTHS[ymParts(cur).m-1].slice(0,3)}</small></div>
        <div class="body"><div class="t">${esc(f.label)}</div></div>
        <div class="amt">${eur(f.amount)}</div>
      </div>`).join("")}
  </div>`:``}

  ${cats.length?`
  <div class="card">
    <span class="eyebrow">Où part l'argent courant</span>
    ${cats.map(([n,a])=>`
      <div class="cat">
        <div class="top"><span class="n">${esc(n)}</span><span class="a">${eur(a)}</span></div>
        <div class="bar"><i style="width:${(a/maxCat)*100}%"></i></div>
      </div>`).join("")}
  </div>`:``}
  `;
}

function drawGauge(){
  const f = document.getElementById("fill"); if(!f) return;
  const p = +document.getElementById("usedPct").value;
  f.style.width = p+"%";
  f.className = "fill" + (p>=100?" over":p>=85?" warn":"");
}

/* =========================================================
   Feuille modale
   ========================================================= */
const scrim=document.getElementById("scrim"), sheet=document.getElementById("sheet"), sheetBody=document.getElementById("sheetBody");
let sheetSave=null;
function closeSheet(){ sheet.classList.remove("open"); scrim.classList.remove("open"); sheetSave=null; }
scrim.onclick = closeSheet;

/* fields: [{k,label,type,options,ph}] type: text|money|day|select|seg */
function openSheet(title, fields, values, onSave, onDelete){
  const v = Object.assign({}, values);
  sheetBody.innerHTML = `<h2>${esc(title)}</h2>` + fields.map(f=>{
    if(f.type==="seg"){
      return `<div class="f"><label>${esc(f.label)}</label><div class="seg" data-k="${f.k}">
        ${f.options.map(o=>`<button type="button" data-v="${esc(o.v)}" class="${v[f.k]===o.v?"on":""}">${esc(o.t)}</button>`).join("")}
      </div></div>`;
    }
    if(f.type==="select"){
      return `<div class="f"><label>${esc(f.label)}</label><select data-k="${f.k}">
        ${f.options.map(o=>`<option value="${esc(o.v)}" ${v[f.k]==o.v?"selected":""}>${esc(o.t)}</option>`).join("")}
      </select></div>`;
    }
    const t = f.type==="money"||f.type==="day" ? "number" : "text";
    const extra = f.type==="money" ? ` step="0.01" inputmode="decimal" class="money"` : f.type==="day" ? ` step="1" min="1" max="31" inputmode="numeric"` : "";
    return `<div class="f"><label>${esc(f.label)}</label>
      <input type="${t}" data-k="${f.k}" value="${v[f.k]!=null?esc(v[f.k]):""}" placeholder="${esc(f.ph||"")}"${extra}></div>`;
  }).join("") + `
    <div class="btnrow" style="margin-top:16px">
      ${onDelete?`<button class="btn ghost" id="shDel" style="flex:0 0 40%">Supprimer</button>`:``}
      <button class="btn" id="shOk">Enregistrer</button>
    </div>`;

  sheetBody.querySelectorAll(".seg").forEach(seg=>{
    seg.onclick = e=>{
      const b=e.target.closest("button"); if(!b) return;
      seg.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
    };
  });

  sheetBody.querySelector("#shOk").onclick = ()=>{
    const out={};
    sheetBody.querySelectorAll("[data-k]").forEach(el=>{
      const k=el.dataset.k;
      if(el.classList.contains("seg")){ const on=el.querySelector("button.on"); out[k]= on?on.dataset.v:null; }
      else out[k]= el.value;
    });
    if(onSave(out)!==false){ closeSheet(); render(); persist(); }
  };
  if(onDelete) sheetBody.querySelector("#shDel").onclick = ()=>{ onDelete(); closeSheet(); render(); persist(); };

  scrim.classList.add("open"); sheet.classList.add("open");
  setTimeout(()=>{ const first=sheetBody.querySelector('input[type="text"],input[type="number"]'); if(first && !values.label && !values.name) first.focus(); },300);
}

function num(x){ const n=parseFloat(String(x).replace(",",".")); return isNaN(n)?0:n; }
function clampDay(x){ let d=parseInt(x,10); if(isNaN(d))return null; return Math.max(1,Math.min(31,d)); }
function todayDay(){ return cur===ymNow() ? new Date().getDate() : 1; }

/* =========================================================
   Actions
   ========================================================= */
function go(t){ tab=t; render(); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),2200); }

function toggleIncome(id){ const i=month(cur).incomes.find(x=>x.id===id); i.got=!i.got; persist(); render(); }
function toggleFixed(id){ const f=month(cur).fixed.find(x=>x.id===id); f.paid=!f.paid; persist(); render(); }

function editIncome(id){
  const M=month(cur); const it = id ? M.incomes.find(x=>x.id===id) : null;
  openSheet(it?"Modifier l'entrée":"Nouvelle entrée",
    [{k:"label",label:"Intitulé",type:"text",ph:"Salaire"},{k:"amount",label:"Montant",type:"money",ph:"0,00"}],
    it||{},
    d=>{ if(!d.label.trim()){toast("Il manque l'intitulé");return false;}
      if(it){ it.label=d.label.trim(); it.amount=num(d.amount); }
      else M.incomes.push({id:uid(),tplId:null,label:d.label.trim(),amount:num(d.amount),got:false}); },
    it ? ()=>{ M.incomes = M.incomes.filter(x=>x.id!==id); } : null);
}

function editFixed(id){
  const M=month(cur); const it = id ? M.fixed.find(x=>x.id===id) : null;
  openSheet(it?"Modifier la charge":"Nouvelle charge",
    [{k:"label",label:"Intitulé",type:"text",ph:"Assurance auto"},
     {k:"amount",label:"Montant",type:"money",ph:"0,00"},
     {k:"day",label:"Jour de prélèvement",type:"day",ph:"5"}],
    it||{day:5},
    d=>{ if(!d.label.trim()){toast("Il manque l'intitulé");return false;}
      if(it){ it.label=d.label.trim(); it.amount=num(d.amount); it.day=clampDay(d.day); }
      else M.fixed.push({id:uid(),tplId:null,label:d.label.trim(),amount:num(d.amount),day:clampDay(d.day),category:"Charge",paid:false}); },
    it ? ()=>{ M.fixed = M.fixed.filter(x=>x.id!==id); } : null);
}

function editExpense(id){
  const M=month(cur); const it = id ? M.expenses.find(x=>x.id===id) : null;
  openSheet(it?"Modifier la dépense":"Nouvelle dépense",
    [{k:"amount",label:"Montant",type:"money",ph:"0,00"},
     {k:"category",label:"Catégorie",type:"select",options:S.categories.map(c=>({v:c,t:c}))},
     {k:"label",label:"Détail (facultatif)",type:"text",ph:"Intermarché"},
     {k:"day",label:"Jour",type:"day"}],
    it||{day:todayDay(),category:S.categories[0]},
    d=>{ const a=num(d.amount); if(a<=0){toast("Indique un montant");return false;}

      else { M.expenses.push({id:uid(),amount:a,category:d.category,label:d.label.trim(),day:clampDay(d.day)||todayDay()}); toast("Dépense enregistrée"); } },
    it ? ()=>{ M.expenses = M.expenses.filter(x=>x.id!==id); } : null);

function editAccount(id){
  const it = id ? S.accounts.find(x=>x.id===id) : null;
  openSheet(it?"Modifier le compte":"Nouveau compte d'épargne",
    [{k:"name",label:"Nom du compte",type:"text",ph:"Livret A"},
     {k:"initial",label:"Solde de départ",type:"money",ph:"0,00"}],

    d=>{ if(!d.name.trim()){toast("Il manque le nom");return false;}

function editMove(id){
  if(!S.accounts.length){ toast("Crée d'abord un compte d'épargne"); return; }
  const M=month(cur); const it = id ? M.moves.find(x=>x.id===id) : null;

     {k:"amount",label:"Montant",type:"money",ph:"0,00"},
     {k:"accountId",label:"Compte",type:"select",options:S.accounts.map(a=>({v:a.id,t:a.name}))},
     {k:"label",label:"Motif (facultatif)",type:"text",ph:"Virement mensuel"},
     {k:"day",label:"Jour",type:"day"}],
    it||{kind:"in",day:todayDay(),accountId:S.accounts[0].id},

      else M.moves.push({id:uid(),kind:d.kind,amount:a,accountId:d.accountId,label:d.label.trim(),day:clampDay(d.day)||todayDay()}); },
    it ? ()=>{ M.moves = M.moves.filter(x=>x.id!==id); } : null);

  const it = id ? S.incomeTemplate.find(x=>x.id===id) : null;

    [{k:"label",label:"Intitulé",type:"text",ph:"Salaire"},{k:"amount",label:"Montant habituel",type:"money",ph:"0,00"}],

        {v:"Crédit",t:"Crédit"},{v:"Impôts",t:"Impôts"},{v:"Transport",t:"Transport"},

    it||{day:5,category:"Abonnement"},
    d=>{ if(!d.label.trim()){toast("Il manque l'intitulé");return false;}
      if(it){ it.label=d.label.trim(); it.amount=num(d.amount); it.day=clampDay(d.day); it.category=d.category; }
      else { const t={id:uid(),label:d.label.trim(),amount:num(d.amount),day:clampDay(d.day),category:d.category};
             S.fixedTemplate.push(t); pushToCurrent("fixed",t); } },
    it ? ()=>{ S.fixedTemplate = S.fixedTemplate.filter(x=>x.id!==id); } : null);
}

/* une nouvelle ligne récurrente est aussi ajoutée aux mois déjà ouverts à partir d'aujourd'hui */
function pushToCurrent(kind,t){
  const now = ymNow();
  for(const ym in S.months){
    if(ym < now) continue;
    const M = S.months[ym];
    if(kind==="income" && !M.incomes.some(x=>x.tplId===t.id))
      M.incomes.push({id:uid(),tplId:t.id,label:t.label,amount:t.amount,got:false});
    if(kind==="fixed" && !M.fixed.some(x=>x.tplId===t.id))
      M.fixed.push({id:uid(),tplId:t.id,label:t.label,amount:t.amount,day:t.day,category:t.category,paid:false});
  }
}

function editCats(){
  openSheet("Catégories",
    [{k:"list",label:"Séparées par des virgules",type:"text"}],
    {list:S.categories.join(", ")},
    d=>{ const arr = d.list.split(",").map(s=>s.trim()).filter(Boolean);
      if(!arr.length){toast("Il faut au moins une catégorie");return false;}
      S.categories = arr; });
}

/* ---------- sauvegarde fichier ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "budget-"+ymNow()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("Fichier de sauvegarde créé");
}
function importData(){
  const inp = document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(!d || typeof d!=="object" || !d.months) throw 0;
        S = Object.assign(blank(), d);
        persist(); render(); toast("Sauvegarde restaurée");
      }catch(e){ toast("Fichier illisible. Choisis un export de cette app."); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function wipe(){
  openSheet("Tout effacer",
    [{k:"c",label:"Tape EFFACER pour confirmer",type:"text",ph:"EFFACER"}], {},
    d=>{ if(d.c.trim().toUpperCase()!=="EFFACER"){ toast("Confirmation incorrecte"); return false; }
      S = blank(); cur = ymNow(); tab="reglages"; toast("Tout a été effacé"); });
}

/* =========================================================
   Navigation
   ========================================================= */
document.getElementById("prevM").onclick = ()=>{ cur=ymShift(cur,-1); render(); };
document.getElementById("nextM").onclick = ()=>{ cur=ymShift(cur, 1); render(); };
document.querySelectorAll("nav button").forEach(b=> b.onclick = ()=>go(b.dataset.tab));
document.getElementById("fab").onclick = ()=>{ if(tab==="epargne") editMove(); else editExpense(); };

/* =========================================================
   Démarrage
   ========================================================= */
(async function init(){
  const saved = await Store.load();
  if(saved) S = Object.assign(blank(), saved);
  month(cur);
  render();
  if("serviceWorker" in navigator){
    try{ navigator.serviceWorker.register("sw.js"); }catch(e){}
  }
})();
</script>
