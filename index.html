<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Relevé</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16202B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Relevé">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --ink:#16202B; --ink-2:#42525F; --ink-3:#7B8A95;
  --panel:#E7EDEB; --surface:#FFFFFF; --line:#CFD9D7; --line-soft:#E2E9E7;
  --teal:#1F7A6B; --indigo:#2E4A6B; --amber:#C97F0A; --amber-soft:#FBF0DC;
  --alert:#B93F2B; --alert-soft:#F8E5E1;
  --w1:#2E4A6B; --w2:#1F7A6B; --w3:#8A5A9B;
  --r:14px; --pad:16px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--panel);color:var(--ink);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(72px + var(--safe-b));overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}

.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) var(--pad) 12px}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar button.nav{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;font-size:17px;flex:none}
.monthbar button.nav:active{background:rgba(255,255,255,.22)}
.monthlabel{text-align:center;flex:1;min-width:0}
.monthlabel .m{font-size:17px;font-weight:650;letter-spacing:-.01em;text-transform:capitalize}
.monthlabel .sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:1px}

main{padding:14px var(--pad) 8px;max-width:620px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card > .eyebrow{margin-bottom:10px;display:block}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-title .act{font-size:13px;font-weight:600;color:var(--indigo);text-align:right;flex:none}

.bigline{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 0 12px}
.big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:38px;font-weight:650;letter-spacing:-.035em;line-height:1}
.big.sm{font-size:31px}
.big.neg{color:var(--alert)}
.big.teal{color:var(--teal)}
.perday{text-align:right;flex:none}
.perday .v{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.perday .l{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

.scale{position:relative;height:36px;margin:2px 0 6px}
.track{position:absolute;left:0;right:0;top:0;height:16px;background:var(--panel);border-radius:4px;overflow:hidden;border:1px solid var(--line);display:flex}
.seg-a{height:100%;width:0;background:var(--indigo);transition:width .7s cubic-bezier(.22,.8,.3,1),background-color .3s}
.seg-a.warn{background:var(--amber)} .seg-a.over{background:var(--alert)}
.seg-b{height:100%;width:0;background:var(--teal);transition:width .7s cubic-bezier(.22,.8,.3,1)}
.pace{position:absolute;top:-3px;width:2px;height:22px;background:var(--ink);transition:left .7s cubic-bezier(.22,.8,.3,1)}
.pace::after{content:"";position:absolute;left:-3px;top:-4px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--ink)}
.pacelabel{position:absolute;top:20px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;transition:left .7s cubic-bezier(.22,.8,.3,1)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2)}
.legend i{width:9px;height:9px;border-radius:2.5px;flex:none}
.verdict{font-size:13px;line-height:1.45;color:var(--ink-2);border-top:1px solid var(--line-soft);padding-top:10px;margin-top:12px}
.verdict b{color:var(--ink);font-weight:650}

.calc{font-size:14.5px}
.calc .l{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-top:1px solid var(--line-soft)}
.calc .l:first-child{border-top:0;padding-top:2px}
.calc .l .n{color:var(--ink-2)}
.calc .l .n small{display:block;font-size:11px;color:var(--ink-3);margin-top:1px;line-height:1.35}
.calc .l .a{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;flex:none;padding-left:10px}
.calc .l.mid{background:var(--panel);margin:0 -14px;padding-left:14px;padding-right:14px}
.calc .l.res{border-top:1.5px solid var(--ink);margin-top:4px;padding-top:11px;font-weight:650}
.calc .l.res .n{color:var(--ink)}
.calc .l.res .a{font-size:18px}
.calc .l.tap .n{color:var(--indigo)}
.a.minus{color:var(--alert)} .a.plus{color:var(--teal)}

.wrow{padding:11px 0;border-top:1px solid var(--line-soft)}
.wrow:first-of-type{border-top:0;padding-top:2px}
.wtop{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.wtop .nm{font-size:15px;font-weight:560;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtop .am{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:650;font-size:15px}
.wtop .am.neg{color:var(--alert)}
.wsub{display:flex;gap:12px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);flex-wrap:wrap}
.wsub b{color:var(--ink-2);font-weight:600}

.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line-soft)}
.row:first-of-type{border-top:0}
.row .body{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:520;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;flex:none}
.row.done .t,.row.done .amt{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.chk{width:26px;height:26px;flex:none;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent;font-size:14px;font-weight:700;transition:.15s}
.chk.on{background:var(--teal);border-color:var(--teal);color:#fff}
.day{width:32px;flex:none;text-align:center;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-2);background:var(--panel);border-radius:7px;padding:4px 0;line-height:1.15}
.day small{display:block;font-size:8px;letter-spacing:.06em;color:var(--ink-3);font-weight:600}

.cat{margin-bottom:11px}.cat:last-child{margin-bottom:0}
.cat .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
.cat .top .n{font-weight:520}
.cat .top .a{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:6px;background:var(--panel);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--indigo);border-radius:3px;transition:width .6s}

.empty{text-align:center;padding:20px 10px;color:var(--ink-3);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--ink-2);font-weight:600;margin-bottom:3px}

.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:11px;font-size:15px;font-weight:600;background:var(--ink);color:#fff}
.btn:active{opacity:.8}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn.teal{background:var(--teal);color:#fff}
.btn.danger{background:var(--alert-soft);color:var(--alert)}
.btn.sm{padding:11px;font-size:14px}
.btnrow{display:flex;gap:8px}.btnrow>*{flex:1}

.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tabs button{flex:none;padding:9px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line-soft);font-size:13.5px;font-weight:520;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.fab{position:fixed;right:16px;bottom:calc(80px + var(--safe-b));z-index:35;width:56px;height:56px;border-radius:19px;background:var(--ink);color:#fff;font-size:26px;font-weight:300;display:grid;place-items:center;box-shadow:0 6px 20px rgba(22,32,43,.28)}
.fab:active{transform:scale(.94)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
nav button{flex:1;padding:9px 1px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);min-width:0}
nav button .ic{font-size:18px;line-height:1}
nav button .lb{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
nav button.on{color:var(--ink)}

.scrim{position:fixed;inset:0;z-index:50;background:rgba(22,32,43,.4);opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:20px 20px 0 0;padding:8px var(--pad) calc(18px + var(--safe-b));max-height:92vh;overflow-y:auto;transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.9,.35,1);box-shadow:0 -8px 30px rgba(22,32,43,.16)}
.sheet.open{transform:translateY(0)}
.handle{width:36px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h2{font-size:18px;font-weight:650;letter-spacing:-.015em;margin:0 0 4px}
.sheet .lead{font-size:13px;color:var(--ink-3);margin:0 0 14px;line-height:1.45}
.sheet .lead b{color:var(--ink-2)}
.f{margin-bottom:12px}
.f label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;font-weight:600}
.f input,.f select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.f input:focus,.f select:focus{outline:2px solid var(--indigo);outline-offset:-1px;border-color:var(--indigo)}
.f input.money{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 40%;padding:11px 6px;border-radius:10px;background:var(--panel);font-size:13.5px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:8px 12px;border-radius:999px;background:var(--panel);font-size:13.5px;font-weight:520}

.banner{background:var(--amber-soft);color:#6B4405;border:1px solid #EBD8AE;border-radius:11px;padding:10px 12px;font-size:12.5px;line-height:1.45;margin-bottom:12px}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:10px}
.total-line{display:flex;justify-content:space-between;align-items:baseline;padding-top:11px;margin-top:4px;border-top:1.5px solid var(--ink);font-weight:650}
.total-line .a{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(98px + var(--safe-b));transform:translate(-50%,14px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:520;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center;line-height:1.45}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="monthbar">
    <button class="nav" id="prevM" aria-label="Mois précédent">‹</button>
    <div class="monthlabel"><div class="m" id="mLabel">—</div><div class="sub" id="mSub">—</div></div>
    <button class="nav" id="nextM" aria-label="Mois suivant">›</button>
  </div>
</header>

<main id="view"></main>
<button class="fab" id="fab" aria-label="Ajouter">+</button>

<nav>
  <button data-tab="releve" class="on"><span class="ic">◔</span><span class="lb">Relevé</span></button>
  <button data-tab="ressources"><span class="ic">↧</span><span class="lb">Ressources</span></button>
  <button data-tab="comptes"><span class="ic">▤</span><span class="lb">Comptes</span></button>
  <button data-tab="epargne"><span class="ic">◈</span><span class="lb">Épargne</span></button>
  <button data-tab="reglages"><span class="ic">⚙</span><span class="lb">Réglages</span></button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="handle"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const KEY = "budget.releve.v1";
const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const WCOL = ["var(--w1)","var(--w2)","var(--w3)","var(--amber)","var(--ink-2)"];

/* ---------- persistance ---------- */
let storeMode = "local";
const Store = {
  async load(){
    try{ const v=localStorage.getItem(KEY); if(v!==null){storeMode="local";return JSON.parse(v);} }catch(e){}
    if(window.storage){ try{ const r=await window.storage.get(KEY); if(r&&r.value){storeMode="preview";return JSON.parse(r.value);} }catch(e){} }
    try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); storeMode="local"; }
    catch(e){ storeMode = window.storage ? "preview" : "memory"; }
    return null;
  },
  async save(data){
    const s=JSON.stringify(data);
    try{ localStorage.setItem(KEY,s); storeMode="local"; return; }catch(e){}
    if(window.storage){ try{ await window.storage.set(KEY,s); storeMode="preview"; return; }catch(e){} }
    storeMode="memory";
  }
};

/* ---------- état ---------- */
const DEFAULT_CATS = ["Courses","Restaurant","Carburant","Transport","Santé","Vêtements","Loisirs","Maison","Cadeaux","Beauté","Enfant","Voyage","Divers"];
function blank(){
  return {
    v:5,
    categories: DEFAULT_CATS.slice(),
    wallets: [
      {id:"w-com",  name:"Compte commun"},
      {id:"w-moi",  name:"Mon compte"},
      {id:"w-elle", name:"Compte de ma femme"}
    ],
    defaultReserve: 0,
    groceryCat: "Courses",
    groceryMonthly: 0,
    incomeTemplate: [], fixedTemplate: [], transferTemplate: [],
    accounts: [], months: {}
  };
}
let S = blank(), cur = ymNow(), tab = "releve", curW = null;

function ymNow(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function ymShift(ym,n){ let [y,m]=ym.split("-").map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+"-"+String(m).padStart(2,"0"); }
function ymParts(ym){ const [y,m]=ym.split("-").map(Number); return {y,m}; }
function daysIn(ym){ const {y,m}=ymParts(ym); return new Date(y,m,0).getDate(); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function W0(){ return (S.wallets[0]||{id:null}).id; }
function wName(id){ const w=S.wallets.find(x=>x.id===id); return w?w.name:"Compte supprimé"; }
function wColor(id){ const i=S.wallets.findIndex(x=>x.id===id); return WCOL[i<0?4:i%WCOL.length]; }
function activeW(){ if(!S.wallets.some(w=>w.id===curW)) curW = W0(); return curW; }

let saveT=null;
function persist(){ clearTimeout(saveT); saveT=setTimeout(()=>Store.save(S),180); }

function month(ym){
  if(!S.months[ym]){
    S.months[ym] = {
      reserve:null, groceryMonthly:null, groceryReleased:0, carry:{},
      refunds:[],
      incomes:   S.incomeTemplate.map(t=>({id:uid(),tplId:t.id,label:t.label,amount:t.amount,wallet:t.wallet||W0(),got:false})),
      fixed:     S.fixedTemplate.map(t=>({id:uid(),tplId:t.id,label:t.label,amount:t.amount,day:t.day,category:t.category,wallet:t.wallet||W0(),paid:false})),
      transfers: S.transferTemplate.map(t=>({id:uid(),tplId:t.id,label:t.label,amount:t.amount,day:t.day,from:t.from,to:t.to})),
      expenses: [], moves: []
    };
    persist();
  }
  return S.months[ym];
}

/* ---------- formatage ---------- */
const nf  = new Intl.NumberFormat("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0});
function eur(n){ return nf.format(n||0)+" €"; }
function eur0(n){ return nf0.format(Math.round(n||0))+" €"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- calculs ---------- */
function reserveOf(ym){ const M=month(ym); return M.reserve!=null ? +M.reserve : (+S.defaultReserve||0); }
function monthlyOf(ym){ const M=month(ym); return M.groceryMonthly!=null ? +M.groceryMonthly : (+S.groceryMonthly||0); }
function isGro(x){ return (x.category||"")===(S.groceryCat||"Courses"); }

function weekBlocks(ym){
  const dim=daysIn(ym), mtot=monthlyOf(ym), M=month(ym);
  const out=[]; let d=1, n=1;
  while(d<=dim){
    const to=Math.min(d+6,dim), days=to-d+1;
    const inRange = x => x.day>=d && x.day<=to;
    const hebdo = M.expenses.find(x=>x.gw===n);
    const spent = M.expenses.filter(x=>isGro(x)&&inRange(x)).reduce((a,x)=>a+(+x.amount||0),0)
                - (M.refunds||[]).filter(x=>x.kind==="refund"&&isGro(x)&&inRange(x)).reduce((a,x)=>a+(+x.amount||0),0);
    const budget = mtot*days/dim;
    out.push({n,from:d,to,days,budget,spent,ecart:budget-spent,
              hebdo: hebdo?(+hebdo.amount||0):null, autres: spent-(hebdo?(+hebdo.amount||0):0)});
    d=to+1; n++;
  }
  return out;
}
function weekOfDay(ym,day){ return Math.floor((day-1)/7)+1; }

function stats(ym, w){
  const M = month(ym);
  const F = a => w ? a.filter(x=>x.wallet===w) : a;
  const sum = a => a.reduce((t,x)=>t+(+x.amount||0),0);
  const inTot   = sum(F(M.incomes));
  const inGot   = sum(F(M.incomes).filter(x=>x.got));
  const fixTot  = sum(F(M.fixed));
  const fixPaid = sum(F(M.fixed).filter(x=>x.paid));
  const allExp  = F(M.expenses);
  const rf      = F(M.refunds||[]);
  const refundG = sum(rf.filter(x=>x.kind==="refund" &&  isGro(x)));
  const refundO = sum(rf.filter(x=>x.kind==="refund" && !isGro(x)));
  const extra   = sum(rf.filter(x=>x.kind==="extra"));
  const courses = sum(allExp.filter(isGro));
  const autres  = sum(allExp.filter(x=>!isGro(x)));
  const coursesNet = courses - refundG;
  const autresNet  = autres  - refundO;
  const occas   = coursesNet + autresNet;
  const tr      = M.transfers||[];
  const trIn    = w ? sum(tr.filter(x=>x.to===w))   : 0;
  const trOut   = w ? sum(tr.filter(x=>x.from===w)) : 0;
  const mv      = w ? M.moves.filter(x=>x.wallet===w) : M.moves;
  const savIn   = sum(mv.filter(x=>x.kind==="in"));
  const savOut  = sum(mv.filter(x=>x.kind==="out"));
  const savNet  = savIn - savOut;

  const cy      = M.carry||{};
  const carry   = w ? (+cy[w]||0) : S.wallets.reduce((a,x)=>a+(+cy[x.id]||0),0);
  const capacite = carry + inTot + extra + trIn - trOut - fixTot;

  const expSeen   = sum(allExp.filter(x=>x.seen));
  const expWait   = sum(allExp.filter(x=>!x.seen));
  const rfSeen    = sum(rf.filter(x=>x.seen));
  const rfWait    = sum(rf.filter(x=>!x.seen));
  const nWait     = allExp.filter(x=>!x.seen).length + rf.filter(x=>!x.seen).length;
  const soldeBanque = carry + inGot + trIn - trOut + rfSeen - fixPaid - expSeen - savNet;
  const attente     = expWait - rfWait;
  const soldeApres  = soldeBanque - attente;

  const monthly    = w ? 0 : monthlyOf(ym);
  const weekly     = w ? 0 : monthly*7/daysIn(ym);
  const provision  = w ? 0 : monthly;
  const released   = w ? 0 : (+M.groceryReleased||0);
  const provLeft   = Math.max(0, provision - released - coursesNet);
  const provUsed   = Math.min(Math.max(0,provision-released), Math.max(0,coursesNet));
  const overGro    = Math.max(0, coursesNet - (provision-released));

  const reserve    = w ? 0 : reserveOf(ym);
  const reserveLeft= Math.max(0, reserve - autresNet);
  const reserveUsed= Math.min(reserve, Math.max(0,autresNet));
  const overRes    = Math.max(0, autresNet - reserve);

  const epargnePos = capacite - occas - provLeft - reserveLeft;
  const reste      = epargnePos - savNet;
  const libre      = capacite - occas - savNet;
  const enAttente  = soldeBanque - libre;

  return {carry,soldeBanque,soldeApres,attente,enAttente,expWait,rfWait,nWait,inTot,inGot,fixTot,fixPaid,fixDue:fixTot-fixPaid,occas,trIn,trOut,savIn,savOut,savNet,
          extra,refundG,refundO,refundTot:refundG+refundO,courses,coursesNet,autres,autresNet,
          monthly,weekly,provision,released,provLeft,provUsed,overGro,
          capacite,reserve,reserveLeft,reserveUsed,overRes,epargnePos,reste,libre,
          nExp:allExp.length,nAut:allExp.filter(x=>!isGro(x)).length,nGro:allExp.filter(isGro).length,
          nInc:F(M.incomes).length,nFix:F(M.fixed).length,nRf:rf.length};
}
function savingsTotal(){
  let t=(S.accounts||[]).reduce((a,x)=>a+(+x.initial||0),0);
  for(const ym in S.months) for(const mv of S.months[ym].moves) t+=(mv.kind==="in"?1:-1)*(+mv.amount||0);
  return t;
}
function accountBalance(id){
  let t=+((S.accounts.find(a=>a.id===id)||{}).initial)||0;
  for(const ym in S.months) for(const mv of S.months[ym].moves) if(mv.accountId===id) t+=(mv.kind==="in"?1:-1)*(+mv.amount||0);
  return t;
}

function monthHasData(ym){
  const M=S.months[ym]; if(!M) return false;
  return (M.incomes||[]).length || (M.fixed||[]).length || (M.expenses||[]).length
      || (M.moves||[]).length || (M.refunds||[]).length || (M.transfers||[]).length;
}
function prevSoldes(ym){
  const prev=ymShift(ym,-1);
  if(!monthHasData(prev)) return null;
  const out={};
  S.wallets.forEach(w=>{ out[w.id]=stats(prev,w.id).libre; });
  return {prev,out};
}
function carryWord(){ return prevSoldes(cur) ? "Report du mois précédent" : "Solde de départ"; }
function carrySet(){ const c=month(cur).carry||{}; return S.wallets.some(w=>c[w.id]!=null); }
function isWeekendBlind(){ const d=new Date().getDay(); return d===5||d===6||d===0||d===1; }

const view = document.getElementById("view");
function render(){
  const {y,m}=ymParts(cur);

  document.getElementById("mSub").textContent = cur===ymNow()?"mois en cours":"relevé archivé";
  document.getElementById("fab").style.display = (tab==="reglages")?"none":"grid";

function storeBanner(){
  if(storeMode==="local") return "";
  if(storeMode==="preview") return `<div class="banner">Tu es en aperçu. Les données restent dans cette conversation, pas sur le téléphone.</div>`;
  return `<div class="banner">Le stockage du navigateur est bloqué. Les données seront perdues en fermant l'onglet.</div>`;
}
function drawGauges(){
  document.querySelectorAll("[data-fill]").forEach(el=>{ el.style.width = el.dataset.fill+"%"; });

/* ================= Comptes ================= */
function goW(id){ curW=id; tab="comptes"; render(); }
function setW(id){ curW=id; render(); }

    ${pv&&(month(cur).carry||{})[w]==null?`<button class="btn ghost sm" style="margin-bottom:12px" onclick="carryFromPrev()">Reprendre les soldes de ${MONTHS[ymParts(pv.prev).m-1]}</button>`:``}
    ${!pv&&(month(cur).carry||{})[w]==null?`<div class="banner" style="margin-bottom:12px">Aucun mois précédent renseigné. Saisis le solde de ce compte tel qu'il était la veille du 1er du mois, avant l'arrivée des salaires et des prélèvements. Bouton <b>Saisir le solde</b> en haut à droite.</div>`:``}
    <div class="calc">
      ${st.carry?`<div class="l"><span class="n">${carryWord()}</span><span class="a ${st.carry<0?"minus":"plus"}">${st.carry<0?"−":"+"}${eur(Math.abs(st.carry))}</span></div>`:``}

      ${(st.trIn||st.trOut)?`<div class="l"><span class="n">Virements internes<small>reçus ${eur0(st.trIn)} · envoyés ${eur0(st.trOut)}</small></span><span class="a ${(st.trIn-st.trOut)<0?"minus":"plus"}">${(st.trIn-st.trOut)>=0?"+":"−"}${eur(Math.abs(st.trIn-st.trOut))}</span></div>`:``}

}

/* ---------- feuille modale ---------- */
const scrim=document.getElementById("scrim"), sheet=document.getElementById("sheet"), sheetBody=document.getElementById("sheetBody");
function closeSheet(){ sheet.classList.remove("open"); scrim.classList.remove("open"); }
scrim.onclick=closeSheet;

function openSheet(title, lead, fields, values, onSave, onDelete){
  const v=Object.assign({},values);
  sheetBody.innerHTML=`<h2>${esc(title)}</h2>`
    +(lead?`<p class="lead">${lead}</p>`:`<div style="height:10px"></div>`)
    +fields.map(f=>{
      if(f.type==="seg") return `<div class="f"><label>${esc(f.label)}</label><div class="seg" data-k="${f.k}">
        ${f.options.map(o=>`<button type="button" data-v="${esc(o.v)}" class="${String(v[f.k])===String(o.v)?"on":""}">${esc(o.t)}</button>`).join("")}</div></div>`;
      if(f.type==="select") return `<div class="f"><label>${esc(f.label)}</label><select data-k="${f.k}">
        ${f.options.map(o=>`<option value="${esc(o.v)}" ${v[f.k]==o.v?"selected":""}>${esc(o.t)}</option>`).join("")}</select></div>`;
      const extra=f.type==="money"?` inputmode="decimal" autocomplete="off" class="money"`:f.type==="day"?` inputmode="numeric" autocomplete="off" maxlength="2"`:"";
      return `<div class="f"><label>${esc(f.label)}</label><input type="text" data-k="${f.k}" value="${v[f.k]!=null?esc(v[f.k]):""}" placeholder="${esc(f.ph||"")}"${extra}></div>`;
    }).join("")
    +`<div class="btnrow" style="margin-top:16px">
      ${onDelete?`<button class="btn ghost" id="shDel" style="flex:0 0 40%">Supprimer</button>`:``}
      <button class="btn" id="shOk">Enregistrer</button></div>`;

  sheetBody.querySelectorAll(".seg").forEach(seg=>{ seg.onclick=e=>{ const b=e.target.closest("button"); if(!b)return;
    seg.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); }; });

  sheetBody.querySelector("#shOk").onclick=()=>{
    const out={};
    sheetBody.querySelectorAll("[data-k]").forEach(el=>{
      const k=el.dataset.k;
      if(el.classList.contains("seg")){ const on=el.querySelector("button.on"); out[k]=on?on.dataset.v:null; }
      else out[k]=el.value;
    });
    if(onSave(out)!==false){ closeSheet(); render(); persist(); }
  };
  if(onDelete) sheetBody.querySelector("#shDel").onclick=()=>{ onDelete(); closeSheet(); render(); persist(); };
  scrim.classList.add("open"); sheet.classList.add("open");
}

function clean(x){ return String(x==null?"":x).replace(/[\s\u00a0\u202f€]/g,"").replace(",","."); }
function num(x){ const n=parseFloat(clean(x)); return isNaN(n)?0:n; }
function clampDay(x){ const d=parseInt(clean(x),10); return isNaN(d)?null:Math.max(1,Math.min(31,d)); }
function todayDay(){ return cur===ymNow()?Math.min(new Date().getDate(),daysIn(cur)):1; }

/* saisie de la dépense réelle d'une semaine */
function editWeek(n){
  const M=month(cur), wk=weekBlocks(cur), b=wk.find(x=>x.n===n); if(!b) return;
  const ex=M.expenses.find(x=>x.gw===n);
  const jour = Math.min(b.to, Math.max(b.from, cur===ymNow()?todayDay():b.to));
  openSheet(`Semaine ${n} · du ${b.from} au ${b.to}`,
    `Budget de la semaine <b class="num">${eur0(b.budget)}</b>. Saisis ce que la course t'a réellement coûté.${b.autres?`<br>Attention, ${eur0(b.autres)} de ${esc((S.groceryCat||"courses").toLowerCase())} sont déjà saisis ailleurs sur cette semaine, ils s'ajoutent à ce montant.`:""}`,
    [{k:"amount",label:"Dépensé cette semaine",type:"money",ph:"0,00"},
     {k:"wallet",label:"Payé avec",type:"select",options:wOpts()},
     {k:"label",label:"Détail (facultatif)",type:"text",ph:"Intermarché"},
     {k:"day",label:"Jour",type:"day"}],
    ex ? {amount:ex.amount,wallet:ex.wallet,label:ex.label,day:ex.day}
       : {amount:"",wallet:W0(),label:"",day:jour},
    d=>{ const a=num(d.amount);
      const day=Math.min(b.to,Math.max(b.from,clampDay(d.day)||jour));
      if(a<=0){ if(ex) M.expenses=M.expenses.filter(x=>x.id!==ex.id); return; }
      if(ex) Object.assign(ex,{amount:a,wallet:d.wallet,label:d.label.trim(),day,seen:ex.seen});
      else M.expenses.push({id:uid(),gw:n,amount:a,category:(S.groceryCat||"Courses"),
                            label:d.label.trim(),day,wallet:d.wallet,seen:false});
      const st=stats(cur), nb=weekBlocks(cur).find(x=>x.n===n);
      toast(`Semaine ${n} : ${eur(nb.spent)} sur ${eur0(nb.budget)}<br>${nb.ecart>=0?"+"+eur0(nb.ecart)+" gardés · ":""}reste <b>${eur0(st.provLeft)}</b> dans l'enveloppe`); },
    ex ? ()=>{ M.expenses=M.expenses.filter(x=>x.id!==ex.id); } : null);
}

function editWallet(id){

      if(it) it.name=d.name.trim(); else S.wallets.push({id:uid(),name:d.name.trim()}); },
    (it&&S.wallets.length>1)?()=>{
      const fb=S.wallets.find(x=>x.id!==id).id;
      const fix=o=>{ if(o.wallet===id) o.wallet=fb; };
      const fixT=o=>{ if(o.from===id) o.from=fb; if(o.to===id) o.to=fb; };
      S.incomeTemplate.forEach(fix); S.fixedTemplate.forEach(fix);
      S.transferTemplate.forEach(fixT); S.transferTemplate=S.transferTemplate.filter(t=>t.from!==t.to);
      for(const ym in S.months){ const M=S.months[ym];
        M.incomes.forEach(fix); M.fixed.forEach(fix); M.expenses.forEach(fix); M.moves.forEach(fix);
        (M.refunds||[]).forEach(fix);
        M.transfers=(M.transfers||[]); M.transfers.forEach(fixT); M.transfers=M.transfers.filter(t=>t.from!==t.to); }
      S.wallets=S.wallets.filter(x=>x.id!==id); if(curW===id) curW=W0();
    }:null);
}

       {v:"Impôts",t:"Impôts"},{v:"Transport",t:"Transport"},{v:"Santé",t:"Santé"},{v:"Charge",t:"Autre"}]}],
    it||{day:5,category:"Abonnement",wallet:W0()},
    d=>{ if(!d.label.trim()){toast("Il manque l'intitulé");return false;}
      if(it) Object.assign(it,{label:d.label.trim(),amount:num(d.amount),day:clampDay(d.day),wallet:d.wallet,category:d.category});
      else { const t={id:uid(),label:d.label.trim(),amount:num(d.amount),day:clampDay(d.day),wallet:d.wallet,category:d.category};
             S.fixedTemplate.push(t); pushToCurrent("fixed",t); } },
    it?()=>{ S.fixedTemplate=S.fixedTemplate.filter(x=>x.id!==id); }:null);
}

function editTplTransfer(id){
  if(S.wallets.length<2){ toast("Il faut au moins deux comptes"); return; }
  const it=id?S.transferTemplate.find(x=>x.id===id):null;
  openSheet(it?"Modifier le virement":"Virement récurrent","Recopié automatiquement sur chaque nouveau mois.",
    [{k:"amount",label:"Montant",type:"money",ph:"0,00"},
     {k:"from",label:"Depuis",type:"select",options:wOpts()},
     {k:"to",label:"Vers",type:"select",options:wOpts()},
     {k:"label",label:"Motif (facultatif)",type:"text",ph:"Part du commun"},
     {k:"day",label:"Jour",type:"day",ph:"2"}],
    it||{day:2,from:W0(),to:(S.wallets[1]||S.wallets[0]).id},
    d=>{ const a=num(d.amount); if(a<=0){toast("Indique un montant");return false;}
      if(d.from===d.to){toast("Choisis deux comptes différents");return false;}
      const o={amount:a,from:d.from,to:d.to,label:d.label.trim(),day:clampDay(d.day)||1};
      if(it) Object.assign(it,o);
      else { const t=Object.assign({id:uid()},o); S.transferTemplate.push(t); pushToCurrent("transfer",t); } },
    it?()=>{ S.transferTemplate=S.transferTemplate.filter(x=>x.id!==id); }:null);
}

function pushToCurrent(kind,t){
  const now=ymNow();
  for(const ym in S.months){
    if(ym<now) continue;
    const M=S.months[ym];
    if(kind==="income"&&!M.incomes.some(x=>x.tplId===t.id))
      M.incomes.push({id:uid(),tplId:t.id,label:t.label,amount:t.amount,wallet:t.wallet,got:false});
    if(kind==="fixed"&&!M.fixed.some(x=>x.tplId===t.id))
      M.fixed.push({id:uid(),tplId:t.id,label:t.label,amount:t.amount,day:t.day,category:t.category,wallet:t.wallet,paid:false});
    if(kind==="transfer"&&!(M.transfers||[]).some(x=>x.tplId===t.id))
      (M.transfers=M.transfers||[]).push({id:uid(),tplId:t.id,label:t.label,amount:t.amount,day:t.day,from:t.from,to:t.to});
  }
}

/* ---------- sauvegarde fichier ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="budget-"+ymNow()+".json"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast("Fichier de sauvegarde créé");
}
function importData(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||typeof d!=="object"||!d.months) throw 0;
      S=migrate(Object.assign(blank(),d)); persist(); render(); toast("Sauvegarde restaurée");
    }catch(e){ toast("Fichier illisible. Choisis un export de cette app."); } };
    r.readAsText(f); };
  inp.click();
}
function wipe(){
  openSheet("Tout effacer","Cette action est définitive.",
    [{k:"c",label:"Tape EFFACER pour confirmer",type:"text",ph:"EFFACER"}],{},
    d=>{ if(d.c.trim().toUpperCase()!=="EFFACER"){toast("Confirmation incorrecte");return false;}
      S=blank(); cur=ymNow(); curW=null; tab="reglages"; toast("Tout a été effacé"); });
}

/* ---------- migration ---------- */
function migrate(d){
  if(!Array.isArray(d.wallets)||!d.wallets.length) d.wallets=blank().wallets;
  if(!Array.isArray(d.transferTemplate)) d.transferTemplate=[];
  if(typeof d.defaultReserve!=="number") d.defaultReserve=0;
  if(typeof d.groceryMonthly!=="number")
    d.groceryMonthly = (typeof d.groceryWeekly==="number" && d.groceryWeekly>0)
      ? Math.round(d.groceryWeekly*30/7*100)/100 : 0;
  delete d.groceryWeekly;
  if(!d.groceryCat) d.groceryCat=(d.categories&&d.categories[0])||"Courses";
  const w0=d.wallets[0].id;
  const fix=o=>{ if(!o.wallet) o.wallet=w0; };
  (d.incomeTemplate||[]).forEach(fix); (d.fixedTemplate||[]).forEach(fix);
  for(const ym in (d.months||{})){
    const M=d.months[ym];
    if(M.reserve===undefined) M.reserve = (typeof M.goal==="number"?M.goal:null);
    delete M.goal;
    if(!Array.isArray(M.transfers)) M.transfers=[];
    if(!Array.isArray(M.refunds)) M.refunds=[];
    if(!M.carry||typeof M.carry!=="object") M.carry={};
    (M.expenses||[]).forEach(x=>{ if(x.seen===undefined) x.seen=true; });
    (M.refunds||[]).forEach(x=>{ if(x.seen===undefined) x.seen=true; });
    if(M.groceryMonthly===undefined)
      M.groceryMonthly = (typeof M.groceryWeekly==="number")
        ? Math.round(M.groceryWeekly*daysIn(ym)/7*100)/100 : null;
    delete M.groceryWeekly;
    if(typeof M.groceryReleased!=="number") M.groceryReleased=0;
    (M.incomes||[]).forEach(fix); (M.fixed||[]).forEach(fix);
    (M.expenses||[]).forEach(fix); (M.moves||[]).forEach(fix);
  }
  d.v=5; return d;
}

/* ---------- navigation ---------- */
document.getElementById("prevM").onclick=()=>{ cur=ymShift(cur,-1); render(); };
document.getElementById("nextM").onclick=()=>{ cur=ymShift(cur,1); render(); };
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
document.getElementById("fab").onclick=()=>{
  if(tab==="ressources") editIncome();
  else if(tab==="epargne") editMove();
  else editExpense();
};

/* ---------- démarrage ---------- */
(async function init(){
  const saved=await Store.load();
  if(saved) S=migrate(Object.assign(blank(),saved));
  curW=W0(); month(cur); render();
  if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }
})();
</script>
