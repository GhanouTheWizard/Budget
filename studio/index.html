<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E1B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<style>
:root{
  --ink:#1E1B2E; --ink-2:#4B4760; --ink-3:#8A8599;
  --bg:#F3F0EA; --surface:#FFFFFF; --soft:#F8F6F1; --line:#DDD7CC; --line-soft:#EAE5DC;
  --accent:#E2573B; --accent-soft:#FBE6E0; --ok:#2F8A64; --ok-soft:#E0F1E8; --warn:#B97A12; --warn-soft:#FAF0D9;
  --ig:#C2387E; --tt:#14A5B0; --yt:#E0352B;
  --ig-soft:#F8E1EC; --tt-soft:#DDF3F4; --yt-soft:#FBE2E0;
  --head:#1E1B2E; --head-ink:#FFFFFF;
  --r:16px; --pad:16px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --shadow:0 1px 2px rgba(30,27,46,.06),0 4px 14px rgba(30,27,46,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#F1EEF7; --ink-2:#C3BED2; --ink-3:#8D879E;
    --bg:#13111C; --surface:#1E1B2A; --soft:#24212F; --line:#363246; --line-soft:#2B2838;
    --accent:#FF7356; --accent-soft:#3A221E; --ok:#53C08F; --ok-soft:#1B3328; --warn:#E8A93A; --warn-soft:#352A15;
    --ig:#F06AAE; --tt:#3CCFD9; --yt:#FF5A4F;
    --ig-soft:#3A1C2C; --tt-soft:#173236; --yt-soft:#3A1D1B;
    --head:#0C0B12; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(78px + var(--safe-b));overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:10px 12px;width:100%;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px;line-height:1.45}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:30;background:var(--head);color:var(--head-ink);padding:calc(var(--safe-t) + 12px) var(--pad) 14px}
.hbar{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}
.hbar .logo{width:38px;height:38px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
.hbar .t{flex:1;min-width:0}
.hbar .t b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hbar .t span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.hbar .ib{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;flex:none;position:relative}
.hbar .ib:active{background:rgba(255,255,255,.22)}
.sdot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:transparent}
.sdot.ok{background:#53C08F}.sdot.sending,.sdot.connect{background:#E8A93A}.sdot.error,.sdot.offline{background:#FF5A4F}

main{max-width:720px;margin:0 auto;padding:14px var(--pad) 20px}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 2px 8px}
.sec:first-child{margin-top:4px}
.sec .act{font-size:13px;font-weight:600;color:var(--accent)}
.hint{font-size:13.5px;color:var(--ink-2)}
.muted{color:var(--ink-3)}

/* capture */
.cap{display:flex;gap:8px}
.cap input{flex:1;background:var(--soft)}
.btn{background:var(--accent);color:#fff;border-radius:12px;padding:11px 16px;font-weight:650;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{filter:brightness(.92)}
.btn.sm{padding:8px 13px;font-size:14px;border-radius:10px}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--yt);border:1px solid var(--line)}
.btn.sq{width:46px;padding:0;flex:none}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:560;color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .c{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:4px}

/* platform pills */
.pp{display:inline-flex;gap:3px;vertical-align:middle}
.p{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:2px 5px;border-radius:5px;line-height:1.3}
.p.ig{background:var(--ig-soft);color:var(--ig)}.p.tt{background:var(--tt-soft);color:var(--tt)}.p.yt{background:var(--yt-soft);color:var(--yt)}

/* rows */
.list{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line-soft);cursor:pointer}
.row:first-child{border-top:0}
.row:active{background:var(--soft)}
.row .bd{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:560;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .s{font-size:12px;color:var(--ink-3);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nx{flex:none;font-size:12.5px;font-weight:650;color:var(--accent);background:var(--accent-soft);border-radius:9px;padding:7px 10px;white-space:nowrap}
.nx:active{filter:brightness(.95)}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--ink-2);border:1px solid var(--line-soft)}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}

.empty{text-align:center;padding:26px 16px;color:var(--ink-3);font-size:14px}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}

/* pipeline strip */
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.pipe button{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:9px 4px;text-align:center;box-shadow:var(--shadow)}
.pipe button b{display:block;font-family:var(--mono);font-size:19px;font-weight:700;line-height:1.1}
.pipe button span{font-size:11px;color:var(--ink-3);font-weight:600}
.pipe button.on{border-color:var(--accent);background:var(--accent-soft)}
.pipe button.on span{color:var(--accent)}

/* calendar */
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calh b{font-size:17px;font-weight:680;text-transform:capitalize}
.calh button{width:34px;height:34px;border-radius:10px;background:var(--soft);border:1px solid var(--line-soft);display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.grid .wd{font-family:var(--mono);font-size:10px;text-align:center;color:var(--ink-3);padding:2px 0 6px;letter-spacing:.06em}
.day{aspect-ratio:1/1.05;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;font-size:13.5px;font-weight:560;position:relative;color:var(--ink)}
.day.out{color:var(--ink-3);opacity:.45}
.day.today{background:var(--accent-soft);color:var(--accent);font-weight:750}
.day.sel{outline:2px solid var(--ink);outline-offset:-2px}
.day .dots{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap;justify-content:center;max-width:30px}
.dot{width:7px;height:7px;border-radius:50%}
.dot.n{background:var(--ink-3)}.dot.plan.n{border-color:var(--ink-3)}
.dot.ig{background:var(--ig)}.dot.tt{background:var(--tt)}.dot.yt{background:var(--yt)}
.dot.plan{background:transparent!important;border:1.6px solid}
.dot.plan.ig{border-color:var(--ig)}.dot.plan.tt{border-color:var(--tt)}.dot.plan.yt{border-color:var(--yt)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-3);margin-top:10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:11px;box-shadow:var(--shadow);min-width:0}
.kpi .h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.kpi .h i{width:8px;height:8px;border-radius:50%;flex:none}
.kpi .h b{font-size:12.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .v{font-family:var(--mono);font-size:20px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.kpi .l{font-size:11px;color:var(--ink-3);margin-bottom:6px}
.kpi .d{font-family:var(--mono);font-size:11px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--yt)}
.bars .b{display:grid;grid-template-columns:96px 1fr 62px;align-items:center;gap:8px;font-size:13px;margin:7px 0}
.bars .b .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bars .b .tr{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bars .b .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bars .b .a{font-family:var(--mono);font-size:12px;text-align:right}
.rank{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink-3);width:18px;flex:none}
.chart{width:100%;height:120px;display:block}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line-soft);padding:6px 6px calc(6px + var(--safe-b));display:flex;justify-content:center}
nav .in{display:flex;width:100%;max-width:720px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--ink-3);border-radius:12px}
nav button.on{color:var(--accent)}
nav button svg{width:23px;height:23px}
nav .badge{font-family:var(--mono);font-size:9.5px;background:var(--accent);color:#fff;border-radius:7px;padding:0 5px;margin-left:2px}

/* sheet */
#scrim{position:fixed;inset:0;z-index:50;background:rgba(10,8,18,.45);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto}
#sheet.open{transform:none;visibility:visible}
#sheet:not(.open){visibility:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s .25s}
#sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 2px;flex:none}
#sheet .sh{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;border-bottom:1px solid var(--line-soft);flex:none}
#sheet .sh h3{margin:0;font-size:17px;font-weight:700;flex:1;letter-spacing:-.01em}
#sheet .sh button{font-size:15px;font-weight:600;color:var(--ink-3)}
#sheet .sh button.save{color:var(--accent);font-weight:700}
#shB{overflow-y:auto;padding:12px 16px calc(20px + var(--safe-b));-webkit-overflow-scrolling:touch}
.fld{margin-bottom:14px}
.fld>label{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);margin-bottom:6px}
.fld .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tg{display:flex;gap:6px;flex-wrap:wrap}
.tg button{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 12px;font-size:14px;font-weight:600;color:var(--ink-2)}
.tg button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.tg button.ig.on{background:var(--ig);border-color:var(--ig);color:#fff}
.tg button.tt.on{background:var(--tt);border-color:var(--tt);color:#fff}
.tg button.yt.on{background:var(--yt);border-color:var(--yt);color:#fff}
.pbox{border:1px solid var(--line-soft);border-radius:13px;padding:11px;margin-bottom:10px;background:var(--soft)}
.pbox .ph{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-weight:650;font-size:14px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sgrid label{font-size:11px;color:var(--ink-3);font-weight:600;display:block;margin-bottom:3px}
.sgrid input{padding:8px 9px;font-family:var(--mono);font-size:15px;background:var(--surface)}
.pbox input[type=url]{background:var(--surface);margin-bottom:8px;font-size:14px}
.foot{display:flex;gap:8px;margin-top:6px}
.foot .btn{flex:1}

#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:560;z-index:60;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:14px}
.kv:first-of-type{border-top:0}
.themes .chip{display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0}
.themes .chip button{color:var(--ink-3);font-size:15px;line-height:1}
.search{position:relative;margin-bottom:10px}
.search input{padding-left:36px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></div>
    <div class="t"><b id="hT">Studio</b><span id="hS"></span></div>
    <button class="ib" id="gear" aria-label="Réglages"><span class="sdot" id="syncDot"></span></button>
  </div>
</header>
<main id="main"></main>
<nav><div class="in">
  <button data-tab="idees"><i data-ico="bulb"></i>Idées</button>
  <button data-tab="prod"><i data-ico="film"></i><span>Production<span id="prodBadge"></span></span></button>
  <button data-tab="cal"><i data-ico="cal"></i>Calendrier</button>
  <button data-tab="stats"><i data-ico="chart"></i>Stats</button>
</div></nav>
<div id="scrim"></div>
<div id="sheet"><div class="grab"></div>
  <div class="sh"><button id="shX">Annuler</button><h3 id="shT"></h3><button class="save" id="shOk">OK</button></div>
  <div id="shB"></div>
</div>
<div id="toast"></div>
<script>
"use strict";
/* ================= icônes ================= */
const ICO={
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/>',
  film:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 9h18M3 15h18M8 5v14M16 5v14"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  left:'<path d="M15 18l-6-6 6-6"/>', right:'<path d="M9 18l6-6-6-6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'
};
function ico(n,s){ return `<svg width="${s||22}" height="${s||22}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICO[n]||""}</svg>`; }

/* ================= constantes ================= */
const PL={ig:{n:"Instagram",s:"IG"},tt:{n:"TikTok",s:"TT"},yt:{n:"YouTube",s:"YT"}};
const PK=["ig","tt","yt"];
const STAGES=[{k:"idee",n:"Idée"},{k:"script",n:"Script"},{k:"tournage",n:"Tournage"},{k:"montage",n:"Montage"},{k:"pret",n:"Prêt"},{k:"publie",n:"Publié"}];
const PROD=["script","tournage","montage","pret"];
const FORMATS=["Short / Reel","Vidéo longue","Carrousel","Post photo","Story","Live"];
const METRICS=[{k:"views",n:"Vues"},{k:"likes",n:"J'aime"},{k:"comments",n:"Comm."},{k:"shares",n:"Partages"},{k:"saves",n:"Enreg."},{k:"subs",n:"Abonnés +"}];
const KEY="studio.data", UIKEY="studio.ui";

/* ================= utilitaires ================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]); }
function clone(x){ return JSON.parse(JSON.stringify(x)); }
function pad(n){ return String(n).padStart(2,"0"); }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function today(){ return iso(new Date()); }
function pd(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=pd(s); d.setDate(d.getDate()+n); return iso(d); }
function dShort(s){ return pd(s).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}); }
function dRel(s){ const n=Math.round((pd(s)-pd(today()))/864e5);
  if(n===0) return "aujourd'hui"; if(n===1) return "demain"; if(n===-1) return "hier";
  if(n>1&&n<7) return pd(s).toLocaleDateString("fr-FR",{weekday:"long"}); return dShort(s); }
function ago(ts){ const n=Math.floor((Date.now()-ts)/864e5); return n<=0?"aujourd'hui":n===1?"hier":n<30?"il y a "+n+" j":"il y a "+Math.floor(n/30)+" mois"; }
function fmtN(n){ n=+n||0; if(n>=1e6) return (n/1e6).toLocaleString("fr-FR",{maximumFractionDigits:1})+" M"; if(n>=1e4) return (n/1e3).toLocaleString("fr-FR",{maximumFractionDigits:1})+" k"; return n.toLocaleString("fr-FR"); }
function pct(x){ return (x*100).toLocaleString("fr-FR",{maximumFractionDigits:1})+" %"; }
function pills(ps){ return `<span class="pp">${PK.filter(p=>(ps||[]).includes(p)).map(p=>`<span class="p ${p}">${PL[p].s}</span>`).join("")}</span>`; }
function stageN(k){ return (STAGES.find(s=>s.k===k)||{}).n||k; }
function nextStage(k){ const i=STAGES.findIndex(s=>s.k===k); return i>=0&&i<STAGES.length-1?STAGES[i+1].k:null; }
let toastT; function toast(h){ const t=document.getElementById("toast"); t.innerHTML=h; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2600); }

/* ================= données ================= */
function blank(){ return {v:1, items:[], themes:["Curiosités","Espace","Sciences","Astrophoto","Livres"], subs:[], prefs:{defPlat:["yt","tt","ig"]}}; }
function migrate(s){ const b=blank(); s=Object.assign(b,s||{}); s.items=(s.items||[]).filter(Boolean); s.subs=s.subs||[]; s.prefs=Object.assign(b.prefs,s.prefs||{}); return s; }
const Store={
  load(){ try{ return migrate(JSON.parse(localStorage.getItem(KEY)||"null")); }catch(e){ return blank(); } },
  save(s){ try{ localStorage.setItem(KEY,JSON.stringify(s)); }catch(e){ toast("Stockage plein ?"); } if(!Sync.quiet) Sync.schedule(); }
};
let S=Store.load();
let UI={tab:"idees",plat:"all",theme:"all",q:"",stage:"all",month:today().slice(0,7),sel:today(),period:"90"};
try{ Object.assign(UI,JSON.parse(localStorage.getItem(UIKEY)||"{}")); }catch(e){}
UI.sel=today(); UI.month=today().slice(0,7);
function saveUI(){ try{ localStorage.setItem(UIKEY,JSON.stringify({tab:UI.tab,plat:UI.plat,period:UI.period})); }catch(e){} }
function commit(){ Store.save(S); render(); }
function item(id){ return S.items.find(i=>i.id===id); }
function newItem(o){ const now=Date.now(); return Object.assign({id:uid(),title:"",platforms:S.prefs.defPlat.slice(),format:"Short / Reel",theme:"",status:"idee",date:"",time:"",hook:"",script:"",tags:"",notes:"",links:{},stats:{},created:now,updated:now},o||{}); }
function touch(it){ it.updated=Date.now(); }
function advance(id){ const it=item(id); if(!it) return; const n=nextStage(it.status); if(!n) return;
  it.status=n; if(n==="publie"&&!it.date) it.date=today(); touch(it); commit();
  toast(n==="publie"?"Publié ! Pense à saisir les stats dans quelques jours":"« "+esc(it.title.slice(0,40))+" » passe en "+stageN(n).toLowerCase()); }

/* ================= vues ================= */
const main=document.getElementById("main");
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===UI.tab));
  const nProd=S.items.filter(i=>PROD.includes(i.status)).length;
  document.getElementById("prodBadge").innerHTML=nProd?`<span class="badge">${nProd}</span>`:"";
  const v={idees:vIdees,prod:vProd,cal:vCal,stats:vStats,reglages:vReglages}[UI.tab]||vIdees;
  main.innerHTML=v(); bindView(); paintSync(); saveUI();
}
function head(t,s){ document.getElementById("hT").textContent=t; document.getElementById("hS").textContent=s||""; }

/* ---- Idées ---- */
function platFilter(list){ return UI.plat==="all"?list:list.filter(i=>(i.platforms||[]).includes(UI.plat)); }
function vIdees(){
  const all=S.items.filter(i=>i.status==="idee");
  head("Idées",all.length+" en réserve");
  let list=platFilter(all);
  if(UI.theme!=="all") list=list.filter(i=>(i.theme||"")===UI.theme);
  if(UI.q){ const q=UI.q.toLowerCase(); list=list.filter(i=>(i.title+" "+i.hook+" "+i.notes+" "+i.tags).toLowerCase().includes(q)); }
  list.sort((a,b)=>b.created-a.created);
  const themes=[...new Set(all.map(i=>i.theme).filter(Boolean))];
  return `
  <div class="card"><div class="cap">
    <input id="capIn" placeholder="Une idée qui passe ? Note-la…" enterkeyhint="done" autocomplete="off">
    <button class="btn sq" id="capBtn" aria-label="Ajouter">${ico("plus")}</button></div></div>
  ${all.length>4?`<div class="search">${ico("search",17)}<input id="qIn" placeholder="Chercher dans les idées" value="${esc(UI.q)}"></div>`:""}
  <div class="chips">${chipPlat(all)}</div>
  ${themes.length?`<div class="chips" style="margin-top:4px"><button class="chip ${UI.theme==="all"?"on":""}" data-th="all">Tous thèmes</button>${themes.map(t=>`<button class="chip ${UI.theme===t?"on":""}" data-th="${esc(t)}">${esc(t)}</button>`).join("")}</div>`:""}
  <div style="height:8px"></div>
  ${list.length?`<div class="list">${list.map(i=>`
    <div class="row" data-open="${i.id}"><div class="bd"><div class="t">${esc(i.title)||"<i class=muted>Sans titre</i>"}</div>
      <div class="s">${pills(i.platforms)}${i.theme?`<span class="tag">${esc(i.theme)}</span>`:""}<span>${ago(i.created)}</span></div></div>
      <button class="nx" data-adv="${i.id}">Script →</button></div>`).join("")}</div>`
   :`<div class="empty"><b>${all.length?"Rien avec ces filtres":"Ta banque d'idées est vide"}</b>${all.length?"Change de filtre pour voir le reste.":"Tape une idée en haut, même en vrac. Tu la développeras plus tard."}</div>`}`;
}
function chipPlat(list){
  const c=p=>list.filter(i=>(i.platforms||[]).includes(p)).length;
  return `<button class="chip ${UI.plat==="all"?"on":""}" data-pl="all">Tout<span class="c">${list.length}</span></button>`+
    PK.map(p=>`<button class="chip ${UI.plat===p?"on":""}" data-pl="${p}">${PL[p].n}<span class="c">${c(p)}</span></button>`).join("");
}

/* ---- Production ---- */
function vProd(){
  const all=S.items.filter(i=>PROD.includes(i.status));
  head("Production",all.length+" en cours");
  const cnt=k=>all.filter(i=>i.status===k).length;
  let html=`<div class="pipe">
    <button data-st="all" class="${UI.stage==="all"?"on":""}"><b>${all.length}</b><span>Tout</span></button>
    ${PROD.map(k=>`<button data-st="${k}" class="${UI.stage===k?"on":""}"><b>${cnt(k)}</b><span>${stageN(k)}</span></button>`).join("")}</div>
    <div class="chips" style="margin-bottom:6px">${chipPlat(all)}</div>`;
  const list=platFilter(all);
  const stages=UI.stage==="all"?PROD:[UI.stage];
  let any=false;
  stages.slice().reverse().forEach(k=>{
    const L=list.filter(i=>i.status===k).sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999")||b.updated-a.updated);
    if(!L.length) return; any=true;
    html+=`<div class="sec"><span class="eyebrow">${stageN(k)} · ${L.length}</span></div><div class="list">${L.map(i=>prodRow(i)).join("")}</div>`;
  });
  if(!any) html+=`<div class="empty"><b>Rien en production</b>Fais passer une idée en script depuis l'onglet Idées.</div>`;
  const ready=S.items.filter(i=>i.status==="pret"&&!i.date).length;
  if(ready) html=`<div class="card" style="background:var(--warn-soft);border-color:transparent"><div class="hint" style="color:var(--warn)"><b>${ready} contenu${ready>1?"s":""} prêt${ready>1?"s":""} sans date de publication.</b> Planifie-les dans le calendrier pour garder le rythme.</div></div>`+html;
  return html;
}
function prodRow(i){
  const n=nextStage(i.status), late=i.date&&i.date<today();
  return `<div class="row" data-open="${i.id}"><div class="bd"><div class="t">${esc(i.title)||"<i class=muted>Sans titre</i>"}</div>
    <div class="s">${pills(i.platforms)}<span class="tag">${esc(i.format)}</span>${i.date?`<span class="tag ${late?"warn":""}">${late?"en retard · ":""}${dRel(i.date)}</span>`:(i.status==="pret"?`<span class="tag warn">sans date</span>`:"")}</div></div>
    ${n?`<button class="nx" data-adv="${i.id}">${n==="publie"?"Publié ✓":stageN(n)+" →"}</button>`:""}</div>`;
}

/* ---- Calendrier ---- */
function vCal(){
  const [Y,M]=UI.month.split("-").map(Number), first=new Date(Y,M-1,1), off=(first.getDay()+6)%7;
  const start=new Date(Y,M-1,1-off), td=today();
  const dated=S.items.filter(i=>i.date&&i.status!=="idee");
  head("Calendrier",dated.filter(i=>i.status!=="publie"&&i.date>=td).length+" à venir");
  let cells=["L","M","M","J","V","S","D"].map(d=>`<div class="wd">${d}</div>`).join("");
  for(let k=0;k<42;k++){
    const d=new Date(start); d.setDate(start.getDate()+k); const s=iso(d);
    if(k>=35&&d.getMonth()!==M-1) break;
    const its=dated.filter(i=>i.date===s);
    const dots=its.flatMap(i=>i.platforms.map(p=>`<i class="dot ${p} ${i.status==="publie"?"":"plan"}"></i>`)).slice(0,6).join("");
    cells+=`<button class="day ${d.getMonth()!==M-1?"out":""} ${s===td?"today":""} ${s===UI.sel?"sel":""}" data-day="${s}">${d.getDate()}<span class="dots">${dots}</span></button>`;
  }
  const selItems=dated.filter(i=>i.date===UI.sel).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  const up=dated.filter(i=>i.status!=="publie"&&i.date>=td&&i.date<=addDays(td,14)).sort((a,b)=>a.date.localeCompare(b.date));
  const monthPub=dated.filter(i=>i.status==="publie"&&i.date.slice(0,7)===UI.month);
  const mLabel=first.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  return `
  <div class="card">
    <div class="calh"><button data-mo="-1">${ico("left",18)}</button><b>${mLabel}</b><button data-mo="1">${ico("right",18)}</button></div>
    <div class="grid">${cells}</div>
    <div class="legend"><span><i class="dot n"></i>Publié</span><span><i class="dot plan n"></i>Prévu</span>
      ${PK.map(p=>`<span><i class="dot ${p}"></i>${PL[p].n}</span>`).join("")}</div>
  </div>
  <div class="sec"><span class="eyebrow">${dShort(UI.sel)}</span><button class="act" data-plan="${UI.sel}">+ Planifier ce jour</button></div>
  ${selItems.length?`<div class="list">${selItems.map(i=>calRow(i)).join("")}</div>`:`<div class="empty" style="padding:14px">Rien ce jour-là.</div>`}
  <div class="sec"><span class="eyebrow">Les 14 prochains jours</span></div>
  ${up.length?`<div class="list">${up.map(i=>calRow(i,true)).join("")}</div>`:`<div class="empty" style="padding:14px"><b>Aucune publication prévue</b>Choisis un jour et planifie un contenu prêt.</div>`}
  <div class="sec"><span class="eyebrow">Rythme de ${first.toLocaleDateString("fr-FR",{month:"long"})}</span></div>
  <div class="kpis">${PK.map(p=>{ const n=monthPub.filter(i=>i.platforms.includes(p)).length;
    return `<div class="kpi"><div class="h"><i style="background:var(--${p})"></i><b>${PL[p].n}</b></div><div class="v">${n}</div><div class="l">publication${n>1?"s":""}</div></div>`; }).join("")}</div>`;
}
function calRow(i,withDate){
  return `<div class="row" data-open="${i.id}"><div class="bd"><div class="t">${esc(i.title)||"Sans titre"}</div>
    <div class="s">${pills(i.platforms)}${withDate?`<span>${dRel(i.date)}</span>`:""}${i.time?`<span>${esc(i.time)}</span>`:""}<span class="tag ${i.status==="publie"?"ok":i.status==="pret"?"":"warn"}">${stageN(i.status)}</span></div></div></div>`;
}

/* ---- Stats ---- */
function inPeriod(i){ if(UI.period==="all") return true; return i.date>=addDays(today(),-(+UI.period)); }
function sumM(list,p,m){ return list.reduce((a,i)=>a+(+((i.stats||{})[p]||{})[m]||0),0); }
function vStats(){
  const pub=S.items.filter(i=>i.status==="publie"&&i.date);
  const list=pub.filter(inPeriod);
  head("Stats",pub.length+" publication"+(pub.length>1?"s":""));
  const per=[["30","30 jours"],["90","3 mois"],["365","1 an"],["all","Tout"]];
  let h=`<div class="chips" style="margin-bottom:8px">${per.map(([k,n])=>`<button class="chip ${UI.period===k?"on":""}" data-per="${k}">${n}</button>`).join("")}</div>`;

  /* par plateforme */
  h+=`<div class="sec"><span class="eyebrow">Par plateforme</span></div><div class="kpis">`+PK.map(p=>{
    const L=list.filter(i=>i.platforms.includes(p)), withS=L.filter(i=>(+((i.stats||{})[p]||{}).views)>0);
    const views=sumM(L,p,"views"), eng=["likes","comments","shares","saves"].reduce((a,m)=>a+sumM(L,p,m),0);
    return `<div class="kpi"><div class="h"><i style="background:var(--${p})"></i><b>${PL[p].n}</b></div>
      <div class="v">${fmtN(views)}</div><div class="l">vues · ${L.length} publi.</div>
      <div class="d">${withS.length?"moy. "+fmtN(Math.round(views/withS.length)):"—"}</div>
      <div class="d muted" style="margin-top:2px">${views?"engag. "+pct(eng/views):""}</div></div>`; }).join("")+`</div>`;

  /* abonnés */
  const subs=S.subs.slice().sort((a,b)=>a.date.localeCompare(b.date));
  h+=`<div class="sec"><span class="eyebrow">Abonnés</span><button class="act" id="addSub">+ Relevé</button></div>`;
  if(subs.length){
    h+=`<div class="kpis">`+PK.map(p=>{ const L=subs.filter(s=>s[p]!=null&&s[p]!==""); const last=L[L.length-1], prev=L[L.length-2];
      const d=last&&prev?(+last[p])-(+prev[p]):null;
      return `<div class="kpi"><div class="h"><i style="background:var(--${p})"></i><b>${PL[p].n}</b></div><div class="v">${last?fmtN(last[p]):"—"}</div>
        <div class="l">${last?"au "+pd(last.date).toLocaleDateString("fr-FR",{day:"numeric",month:"short"}):"pas de relevé"}</div>
        ${d!=null?`<div class="d ${d>=0?"up":"down"}">${d>=0?"+":""}${fmtN(d).replace("-","−")}</div>`:""}</div>`; }).join("")+`</div>`;
    if(subs.length>1) h+=`<div class="card" style="margin-top:8px">${subChart(subs)}</div>`;
  } else h+=`<div class="card"><div class="hint">Note tes abonnés de temps en temps (une fois par semaine suffit). Tu verras ta courbe de progression sur chaque plateforme.</div></div>`;

  /* top */
  const scored=list.map(i=>({i,v:PK.reduce((a,p)=>a+(+((i.stats||{})[p]||{}).views||0),0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,5);
  h+=`<div class="sec"><span class="eyebrow">Top contenus</span></div>`;
  h+=scored.length?`<div class="list">${scored.map((x,k)=>`<div class="row" data-open="${x.i.id}"><span class="rank">${k+1}</span><div class="bd"><div class="t">${esc(x.i.title)}</div><div class="s">${pills(x.i.platforms)}<span>${dShort(x.i.date)}</span></div></div><span class="num" style="font-weight:700">${fmtN(x.v)}</span></div>`).join("")}</div>`
    :`<div class="empty" style="padding:14px">Pas encore de vues saisies sur la période.</div>`;

  /* thèmes */
  const th={}; list.forEach(i=>{ const v=PK.reduce((a,p)=>a+(+((i.stats||{})[p]||{}).views||0),0); if(!v) return; const k=i.theme||"Sans thème"; th[k]=th[k]||{s:0,n:0}; th[k].s+=v; th[k].n++; });
  const tl=Object.entries(th).map(([k,o])=>[k,o.s/o.n,o.n]).sort((a,b)=>b[1]-a[1]);
  if(tl.length>1){ const mx=tl[0][1];
    h+=`<div class="sec"><span class="eyebrow">Vues moyennes par thème</span></div><div class="card bars">${tl.map(([k,v,n])=>`<div class="b"><span class="n">${esc(k)} <span class="muted">(${n})</span></span><span class="tr"><i style="width:${Math.max(4,v/mx*100)}%"></i></span><span class="a">${fmtN(Math.round(v))}</span></div>`).join("")}</div>`; }

  /* à compléter */
  const todo=pub.filter(i=>i.date<=addDays(today(),-2)&&i.platforms.some(p=>!(+((i.stats||{})[p]||{}).views))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  if(todo.length) h+=`<div class="sec"><span class="eyebrow">Stats à saisir · ${todo.length}</span></div><div class="list">${todo.map(i=>`<div class="row" data-open="${i.id}"><div class="bd"><div class="t">${esc(i.title)}</div><div class="s">${pills(i.platforms.filter(p=>!(+((i.stats||{})[p]||{}).views)))}<span>publié ${dRel(i.date)}</span></div></div><span class="nx">Saisir</span></div>`).join("")}</div>`;
  if(!pub.length) h+=`<div class="empty"><b>Pas encore de publication</b>Quand un contenu passe en « Publié », tu pourras noter ses vues, j'aime et partages ici.</div>`;
  return h;
}
function subChart(subs){
  const W=640,H=120,P=6; const t0=pd(subs[0].date).getTime(), t1=Math.max(pd(subs[subs.length-1].date).getTime(),t0+1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`+PK.map(p=>{
    const L=subs.filter(s=>s[p]!=null&&s[p]!==""); if(L.length<2) return "";
    const vs=L.map(s=>+s[p]), mn=Math.min(...vs), mx=Math.max(...vs), rg=mx-mn||1;
    const pts=L.map(s=>[P+(pd(s.date).getTime()-t0)/(t1-t0)*(W-2*P), H-P-((+s[p])-mn)/rg*(H-2*P)]);
    return `<polyline fill="none" stroke="var(--${p})" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round" points="${pts.map(x=>x.join(",")).join(" ")}"/>`;
  }).join("")+`</svg><div class="legend">${PK.map(p=>`<span><i class="dot ${p}"></i>${PL[p].n}</span>`).join("")}<span>évolution relative</span></div>`;
}

  <div class="card"><span class="eyebrow">Sauvegarde</span>

/* ================= interactions ================= */
function bindView(){
  const $=s=>main.querySelector(s), $$=s=>main.querySelectorAll(s);
  $$("[data-open]").forEach(e=>e.onclick=()=>editItem(e.dataset.open));
  $$("[data-adv]").forEach(e=>e.onclick=ev=>{ ev.stopPropagation(); advance(e.dataset.adv); });
  $$("[data-pl]").forEach(e=>e.onclick=()=>{ UI.plat=e.dataset.pl; render(); });
  $$("[data-th]").forEach(e=>e.onclick=()=>{ UI.theme=e.dataset.th; render(); });
  $$("[data-st]").forEach(e=>e.onclick=()=>{ UI.stage=e.dataset.st; render(); });
  $$("[data-per]").forEach(e=>e.onclick=()=>{ UI.period=e.dataset.per; render(); });
  $$("[data-mo]").forEach(e=>e.onclick=()=>{ const [y,m]=UI.month.split("-").map(Number); const d=new Date(y,m-1+(+e.dataset.mo),1); UI.month=iso(d).slice(0,7); render(); });
  $$("[data-day]").forEach(e=>e.onclick=()=>{ UI.sel=e.dataset.day; if(UI.sel.slice(0,7)!==UI.month) UI.month=UI.sel.slice(0,7); render(); });
  $$("[data-plan]").forEach(e=>e.onclick=()=>planDay(e.dataset.plan));
  const cap=$("#capIn");
  if(cap){ const add=()=>{ const t=cap.value.trim(); if(!t){ cap.focus(); return; }
      const it=newItem({title:t}); if(UI.theme!=="all") it.theme=UI.theme; if(UI.plat!=="all") it.platforms=[UI.plat];
      S.items.unshift(it); commit(); toast("Idée notée"); const c=main.querySelector("#capIn"); if(c) c.focus(); };
    cap.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } }; $("#capBtn").onclick=add; }
  const q=$("#qIn"); if(q) q.oninput=()=>{ UI.q=q.value; const pos=q.selectionStart; render(); const n=main.querySelector("#qIn"); n.focus(); n.setSelectionRange(pos,pos); };
  const as=$("#addSub"); if(as) as.onclick=editSubs;
  /* réglages */
  const thb=$("#thBtn"); if(thb){ const add=()=>{ const v=$("#thIn").value.trim(); if(!v) return; if(!S.themes.includes(v)) S.themes.push(v); commit(); }; thb.onclick=add; $("#thIn").onkeydown=e=>{ if(e.key==="Enter") add(); }; }
  $$("[data-rmth]").forEach(e=>e.onclick=()=>{ S.themes.splice(+e.dataset.rmth,1); commit(); });
  $$("[data-defp]").forEach(e=>e.onclick=()=>{ const p=e.dataset.defp, a=S.prefs.defPlat; if(a.includes(p)){ if(a.length>1) a.splice(a.indexOf(p),1); } else a.push(p); commit(); });

    async cas(expV,data){ return !!(await rpc("studio_cas",{p_hid:hid,p_expected:expV,p_iv:data.iv,p_d:data.d,p_z:!!data.z})); },

  if(!Sync.available()) return "";
  if(!Sync.on) return `<div class="card"><span class="eyebrow">Synchronisation</span>
    <div class="hint" style="margin:6px 0 12px">Retrouve tes idées et ton planning sur ton téléphone et ton ordinateur. Tout est chiffré sur l'appareil avec ton mot de passe : le serveur ne voit rien.</div>
    <button class="btn sm" id="syncBtn">Activer sur cet appareil</button></div>`;
  return `<div class="card"><span class="eyebrow">Synchronisation</span>
    <div class="kv" style="margin-top:6px"><span>État</span><span id="syncState" style="text-align:right">${syncLabel()}</span></div>
    <div class="foot" style="margin-top:10px"><button class="btn sm ghost" id="syncNow">Synchroniser</button><button class="btn sm danger" id="syncLeave">Désactiver ici</button></div></div>`;
}
function editSync(){
  const hasData=S.items.length>0;
  let mode=hasData?"create":"join";
  const draw=()=>{ sheetBody.innerHTML=`
    <div class="hint" style="margin-bottom:14px">Utilise <b>le même mot de passe sur tous tes appareils</b>. Le premier envoie ses données, les suivants les reprennent (une copie de leurs données actuelles est gardée). Sans ce mot de passe, impossible de relire les données : note-le bien.</div>
    <div class="fld"><label>Cet appareil</label><div class="tg"><button class="${mode==="create"?"on":""}" data-m="create">Premier appareil</button><button class="${mode==="join"?"on":""}" data-m="join">Rejoindre</button></div></div>
    <div class="fld"><label>Mot de passe (10 caractères minimum)</label><input type="password" id="sp1" autocomplete="new-password" autocapitalize="off"></div>
    <div class="fld"><label>Le même, une seconde fois</label><input type="password" id="sp2" autocomplete="new-password" autocapitalize="off"></div>`;
    sheetBody.querySelectorAll("[data-m]").forEach(e=>e.onclick=()=>{ mode=e.dataset.m; const g=k=>document.getElementById(k), a=g("sp1").value, b=g("sp2").value; draw(); g("sp1").value=a; g("sp2").value=b; }); };
  openSheet("Synchronisation","",()=>{
    const p=(document.getElementById("sp1").value||"").trim();
    if(p.length<10){ toast("10 caractères minimum, une petite phrase par exemple"); return false; }
    if(p!==(document.getElementById("sp2").value||"").trim()){ toast("Les deux mots de passe ne sont pas identiques"); return false; }
    toast("Connexion…");
    Sync.join(p,mode).then(created=>{ render(); toast(created?"Synchro activée. Fais pareil sur ton autre appareil":"Appareil relié, données chargées"); })
      .catch(e=>{ Sync.cfg=null; Sync.saveCfg(); render(); toast("Échec : "+esc(e.message||e)); });
  },"Activer");
  draw();
}

/* ================= démarrage ================= */
document.getElementById("gear").insertAdjacentHTML("afterbegin",ico("gear",20));
document.getElementById("gear").onclick=()=>{ UI.tab=UI.tab==="reglages"?"idees":"reglages"; render(); window.scrollTo(0,0); };
document.querySelectorAll("[data-ico]").forEach(e=>e.outerHTML=ico(e.dataset.ico));
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{ UI.tab=b.dataset.tab; render(); window.scrollTo(0,0); });
render();
Sync.start();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&Sync.on) Sync.push(); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
