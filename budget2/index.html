<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Budget 2</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget 2">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<style>
:root{
  --ink:#1B2430; --ink-2:#465364; --ink-3:#7E8B99;
  --panel:#E9EEEC; --surface:#FFFFFF; --line:#CFD8D6; --line-soft:#E3E9E7;
  --teal:#2A7F6F; --teal-soft:#E1F0EC; --indigo:#34578A; --amber:#B47A15; --amber-soft:#FBF0DA;
  --alert:#B7402C; --alert-soft:#F9E5E0;
  --c1:#34578A; --c2:#2A7F6F; --c3:#8A5A9B;
  --r:16px; --pad:16px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--panel);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(74px + var(--safe-b));overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) var(--pad) 12px}
.hbar{display:flex;align-items:center;gap:8px}
.hbar .nav{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;font-size:17px;flex:none}
.hbar .nav:active{background:rgba(255,255,255,.22)}
.hbar .mid{flex:1;text-align:center;min-width:0}
.hbar .m{font-size:17px;font-weight:650;letter-spacing:-.01em;text-transform:capitalize}
.hbar .sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:1px}

main{padding:14px var(--pad) 8px;max-width:620px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card > .eyebrow{margin-bottom:10px;display:block}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec .act{font-size:13px;font-weight:600;color:var(--indigo);flex:none;text-align:right}

/* étapes */
.steps{display:flex;gap:6px;margin-bottom:12px}
.step{flex:1;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:9px 10px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.step .d{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;color:transparent;flex:none}
.step.on{color:var(--ink)}
.step.on .d{background:var(--teal);border-color:var(--teal);color:#fff}
.step.cur{border-color:var(--ink)}

/* jauge de compte */
.acc{padding:14px}
.acc .top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.acc .top .dot{width:10px;height:10px;border-radius:3px;flex:none;position:relative;top:1px}
.acc .top .nm{font-size:15px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .top .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:650;letter-spacing:-.03em}
.acc .top .v.neg{color:var(--alert)}
.g{position:relative;height:14px;background:var(--panel);border-radius:4px;border:1px solid var(--line);overflow:hidden;margin:4px 0 6px}
.g .neg{position:absolute;top:0;bottom:0;left:0;background:repeating-linear-gradient(135deg,var(--alert-soft) 0 4px,#F3D3CC 4px 8px)}
.g .fill{position:absolute;top:0;bottom:0;background:var(--teal);transition:width .6s cubic-bezier(.22,.8,.3,1),left .6s}
.g .fill.red{background:var(--alert)}
.g .zero{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.g .bank{position:absolute;top:0;bottom:0;width:2px;background:var(--amber)}
.acc .sub{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.acc .sub b{color:var(--ink-2);font-weight:600}
.acc .warn{margin-top:9px;font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:10px;background:var(--amber-soft);color:#6B4405}
.acc .warn.bad{background:var(--alert-soft);color:#7A2A1C}

/* lignes */
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line-soft)}
.row:first-of-type{border-top:0}
.row .body{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:520;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;flex:none;text-align:right}
.row .amt small{display:block;font-size:10px;font-weight:500;color:var(--ink-3)}
.row.done .t,.row.done .amt{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.chk{width:26px;height:26px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent;font-size:13px;font-weight:700;transition:.15s}
.chk.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chk.sq{border-radius:8px}
.day{width:34px;flex:none;text-align:center;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-2);background:var(--panel);border-radius:7px;padding:4px 0;line-height:1.15}
.day small{display:block;font-size:8px;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.daylabel{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:14px 0 2px}
.daylabel:first-child{margin-top:0}

/* calc */
.calc{font-size:14.5px}
.calc .l{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-top:1px solid var(--line-soft)}
.calc .l:first-child{border-top:0;padding-top:2px}
.calc .l .n{color:var(--ink-2)}
.calc .l .n small{display:block;font-size:11px;color:var(--ink-3);margin-top:1px;line-height:1.35}
.calc .l .a{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;flex:none;padding-left:10px}
.calc .l.mid{background:var(--panel);margin:0 -14px;padding-left:14px;padding-right:14px}
.calc .l.res{border-top:1.5px solid var(--ink);margin-top:4px;padding-top:11px;font-weight:650}
.calc .l.res .n{color:var(--ink)} .calc .l.res .a{font-size:18px}
.calc .l.tap .n{color:var(--indigo)}
.calc .l.head{border-top:0;padding:10px 0 2px}
.calc .l.head .n{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.a.minus{color:var(--alert)} .a.plus{color:var(--teal)}
.big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:34px;font-weight:650;letter-spacing:-.035em;line-height:1;margin:2px 0 12px}
.big.neg{color:var(--alert)} .big.teal{color:var(--teal)}

.empty{text-align:center;padding:18px 10px;color:var(--ink-3);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--ink-2);font-weight:600;margin-bottom:3px}
.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:12px;font-size:15px;font-weight:600;background:var(--ink);color:#fff}
.btn:active{opacity:.8}
.btn.ghost{background:var(--panel);color:var(--ink)} .btn.teal{background:var(--teal);color:#fff}
.btn.danger{background:var(--alert-soft);color:var(--alert)} .btn.sm{padding:11px;font-size:14px}
.btnrow{display:flex;gap:8px}.btnrow>*{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tabs button{flex:none;padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line-soft);font-size:13.5px;font-weight:520;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.banner{background:var(--amber-soft);color:#6B4405;border:1px solid #EBD8AE;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.45;margin-bottom:12px}
.banner.info{background:var(--teal-soft);color:#1E4F46;border-color:#BFDDD5}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:10px}
.pill{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--panel);color:var(--ink-2);font-weight:600}
.pill.t{background:var(--teal-soft);color:var(--teal)} .pill.w{background:var(--amber-soft);color:var(--amber)} .pill.r{background:var(--alert-soft);color:var(--alert)}

.fab{position:fixed;right:16px;bottom:calc(82px + var(--safe-b));z-index:35;width:58px;height:58px;border-radius:20px;background:var(--ink);color:#fff;font-size:28px;font-weight:300;display:grid;place-items:center;box-shadow:0 6px 20px rgba(27,36,48,.3)}
.fab:active{transform:scale(.94)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
nav button{flex:1;padding:9px 1px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);min-width:0}
nav button .ic{font-size:18px;line-height:1}
nav button .lb{font-family:var(--mono);font-size:7.6px;letter-spacing:.02em;text-transform:uppercase;font-weight:600}
nav button.on{color:var(--ink)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(27,36,48,.42);opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:22px 22px 0 0;padding:8px var(--pad) calc(18px + var(--safe-b));max-height:92vh;overflow-y:auto;transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.9,.35,1);box-shadow:0 -8px 30px rgba(27,36,48,.16)}
.sheet.open{transform:translateY(0)}
.handle{width:36px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h2{font-size:18px;font-weight:650;letter-spacing:-.015em;margin:0 0 4px}
.sheet .lead{font-size:13px;color:var(--ink-3);margin:0 0 14px;line-height:1.45} .sheet .lead b{color:var(--ink-2)}
.f{margin-bottom:12px}
.f label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;font-weight:600}
.f input,.f select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-size:16px}
.f input:focus,.f select:focus{outline:2px solid var(--indigo);outline-offset:-1px;border-color:var(--indigo)}
.f input.money{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:22px;padding:14px 12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 30%;padding:11px 6px;border-radius:11px;background:var(--panel);font-size:13.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:8px 12px;border-radius:999px;background:var(--panel);font-size:13.5px;font-weight:520}
.chips button.on{background:var(--ink);color:#fff}
.linklist{border:1px solid var(--line-soft);border-radius:11px;overflow:hidden;max-height:220px;overflow-y:auto}
.linklist .row{padding:10px 12px;border-top:1px solid var(--line-soft)} .linklist .row:first-child{border-top:0}
.linklist .row.on{background:var(--teal-soft)}
.seg[data-k="kind"] button{flex:1 1 22%;font-size:13px;padding:11px 4px}
.cap{padding:10px 0;border-top:1px solid var(--line-soft)} .cap:first-of-type{border-top:0;padding-top:2px}
.cap .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14.5px}
.cap .h .a{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px;flex:none}
.cap .h .a small{color:var(--ink-3);font-weight:500}
.bar{height:8px;background:var(--panel);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--teal);border-radius:4px;transition:width .6s cubic-bezier(.22,.8,.3,1)}
.bar i.w{background:var(--amber)} .bar i.r{background:var(--alert)}
/* actions rapides et prévisionnel */
.qa{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.qa button{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--ink)}
.qa button .i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;font-weight:700;color:#fff}
.qa button:active{transform:scale(.97)}
.acc .now{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:30px;font-weight:650;letter-spacing:-.035em;line-height:1.05}
.acc .now.neg{color:var(--alert)}
.acc .endl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;color:var(--ink-2);margin:6px 0 2px}
.acc .endl b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px}
.fc{margin-top:10px;border-top:1px solid var(--line-soft);padding-top:4px}
.fc .e{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:14px}
.fc .e:first-child{border-top:0}
.fc .e .w{width:62px;flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);line-height:1.2}
.fc .e .l{flex:1;min-width:0;color:var(--ink-2);line-height:1.3}
.fc .e .m{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;text-align:right;flex:none}
.fc .e .m small{display:block;font-weight:500;color:var(--ink-3);font-size:11px}
.fc .e.end{border-top:1.5px solid var(--ink);font-weight:650;color:var(--ink)} .fc .e.end .l{color:var(--ink)}
.toggle{font-size:12.5px;font-weight:600;color:var(--indigo);margin-top:8px;display:inline-block}
/* alertes */
.alarm{background:var(--alert);color:#fff;border-radius:18px;padding:16px 16px 14px;margin-bottom:12px;box-shadow:0 8px 24px rgba(183,64,44,.32)}
.alarm .top{display:flex;gap:12px;align-items:flex-start}
.alarm .ic{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--alert);display:grid;place-items:center;font-size:24px;font-weight:800;flex:none;animation:pulse 1.6s ease-in-out infinite}
.alarm .tt{font-size:21px;font-weight:750;letter-spacing:-.02em;line-height:1.2}
.alarm .tx{font-size:14px;line-height:1.45;margin-top:5px;opacity:.95}
.alarm .more{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.3);font-size:13.5px}
.alarm .more div{padding:5px 0;line-height:1.4} .alarm .more b{font-weight:700}
.alarm .kick{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:6px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.warns{background:var(--amber-soft);border:1px solid #EBD8AE;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#6B4405;line-height:1.45}
.warns div{padding:3px 0} .warns b{font-weight:650}
.warns{background:#FCE9D2;border-color:#F0C690;color:#7A4708}
.infos{background:#FBF6DC;border:1px solid #EADFA6;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#5E5413;line-height:1.45}
.infos div{padding:3px 0} .infos b{font-weight:650}
.ticks{position:relative;height:0}
.ticks i{position:absolute;top:-11px;width:1.5px;height:12px;background:rgba(27,36,48,.28)}
nav button{position:relative}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--alert);color:#fff;font-family:var(--mono);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.bigalert{position:fixed;inset:0;z-index:70;background:rgba(122,20,10,.55);display:none;align-items:center;justify-content:center;padding:24px}
.bigalert.on{display:flex}
.bigalert .box{background:var(--alert);color:#fff;border-radius:24px;padding:26px 22px 20px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .3s cubic-bezier(.3,1.4,.5,1)}
.bigalert .ic{width:64px;height:64px;border-radius:50%;background:#fff;color:var(--alert);display:grid;place-items:center;font-size:40px;font-weight:800;margin:0 auto 14px}
.bigalert h3{font-size:25px;line-height:1.15;margin:0 0 10px;letter-spacing:-.02em}
.bigalert p{font-size:15px;line-height:1.5;margin:0 0 18px}
.bigalert button{background:#fff;color:var(--alert);width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:16px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
/* graphiques */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--ink-3)}
.chart .lbl{fill:var(--ink-2);font-size:10.5px;font-weight:600}
.stat{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 12px}
.stat div{flex:1;min-width:120px}
.stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:650;letter-spacing:-.03em;line-height:1.1;margin-top:3px}
.legend{display:flex;flex-direction:column;gap:7px;margin-top:12px;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
.legend .n{flex:1;color:var(--ink-2)} .legend .a{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.legend .a small{color:var(--ink-3);font-weight:500;margin-left:6px}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.stack i{display:block;height:100%}
.cbar{padding:8px 0}
.cbar .h{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:5px}
.cbar .h .a{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.cbar .h .a small{color:var(--ink-3);font-weight:500}
.cbar .t{position:relative;height:10px;background:var(--panel);border-radius:4px}
.cbar .t i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:#3F6DB5;width:0;transition:width .6s cubic-bezier(.22,.8,.3,1)}
.cbar .t i.over{background:var(--alert)}
.cbar .t b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.tip{position:fixed;z-index:65;background:var(--ink);color:#fff;font-size:12.5px;padding:7px 10px;border-radius:9px;pointer-events:none;opacity:0;transition:opacity .15s;max-width:220px;line-height:1.4}
.tip.on{opacity:1}
.sal{display:flex;align-items:center;gap:12px}

<script>
"use strict";
const KEY="budget2.v1";
const APP_VERSION="v8 · 1er octobre 2026";
const MONTHS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MSHORT=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const DAYS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const CCOL=["var(--c1)","var(--c2)","var(--c3)","var(--amber)","var(--ink-2)"];

/* ================= persistance ================= */
let storeMode="local";
const Store={
  async load(){
    try{ const v=localStorage.getItem(KEY); if(v!==null){storeMode="local";return JSON.parse(v);} }catch(e){}
    if(window.storage){ try{ const r=await window.storage.get(KEY); if(r&&r.value){storeMode="preview";return JSON.parse(r.value);} }catch(e){} }
    try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); storeMode="local"; }catch(e){ storeMode=window.storage?"preview":"memory"; }
    return null;
  },
  async save(d){ const s=JSON.stringify(d);
    try{ localStorage.setItem(KEY,s); storeMode="local"; return; }catch(e){}
    if(window.storage){ try{ await window.storage.set(KEY,s); storeMode="preview"; return; }catch(e){} }
    storeMode="memory"; }
};
let saveT=null; function persist(){ clearTimeout(saveT); saveT=setTimeout(()=>Store.save(S),180); }

/* ================= état ================= */
function blank(){
  return {
    v:1,
    accounts:[
      {id:"a-com", name:"Compte commun", overdraft:150},
      {id:"a-moi", name:"Mon compte", overdraft:150},
      {id:"a-elle", name:"Son compte", overdraft:150}
    ],
    savings:[],
    categories:[
      {id:"c-courses",name:"Courses",pocket:"courses",refund:false},
      {id:"c-repas",name:"Repas travail",pocket:"repas",refund:false},
      {id:"c-sante",name:"Santé",pocket:"securite",refund:true},
      {id:"c-pro",name:"Frais pro",pocket:"securite",refund:true},
      {id:"c-resto",name:"Restos & snacks",pocket:"securite",refund:false},
      {id:"c-carb",name:"Carburant",pocket:"securite",refund:false},
      {id:"c-transp",name:"Transport",pocket:"securite",refund:false},
      {id:"c-livres",name:"Livres",pocket:"securite",refund:false},
      {id:"c-vet",name:"Vêtements",pocket:"securite",refund:false},
      {id:"c-loisirs",name:"Loisirs",pocket:"securite",refund:false},
      {id:"c-maison",name:"Maison",pocket:"securite",refund:false},
      {id:"c-cadeaux",name:"Cadeaux",pocket:"securite",refund:false},
      {id:"c-beaute",name:"Beauté",pocket:"securite",refund:false},
      {id:"c-divers",name:"Divers",pocket:"securite",refund:false}
    ],
    recurring:[],           // charges récurrentes (modèle)
    defaults:{ salaryAccount:"a-moi", salaryLabel:"Salaire", coursesAccount:"a-com", courses:0,
               repasUnit:20, repasCount:0, securite:{} },
    months:{}
  };
}
let S=blank(), cur=ymNow(), tab="today", filFilter="all";

function ymNow(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function ymShift(ym,n){ let [y,m]=ym.split("-").map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+"-"+String(m).padStart(2,"0"); }
function ymParts(ym){ const [y,m]=ym.split("-").map(Number); return {y,m}; }
function daysIn(ym){ const {y,m}=ymParts(ym); return new Date(y,m,0).getDate(); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function isCur(){ return cur===ymNow(); }
function today(){ return isCur()?Math.min(new Date().getDate(),daysIn(cur)):daysIn(cur); }
function acc(id){ return S.accounts.find(a=>a.id===id); }
function accName(id){ const a=acc(id); return a?a.name:"?"; }
function accColor(id){ const i=S.accounts.findIndex(a=>a.id===id); return CCOL[i<0?4:i%CCOL.length]; }
function cat(id){ return S.categories.find(c=>c.id===id)||{id,name:id||"?",pocket:"securite",refund:false}; }
function catByName(n){ return S.categories.find(c=>c.name.toLowerCase()===String(n||"").toLowerCase()); }
function A0(){ return S.accounts[0].id; }

const nf=new Intl.NumberFormat("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0=new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0});
function eur(n){ return nf.format(n||0)+" €"; }
function eur0(n){ return nf0.format(Math.round(n||0))+" €"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function clean(x){ return String(x==null?"":x).replace(/[\s\u00a0\u202f€]/g,"").replace(",","."); }
function num(x){ const n=parseFloat(clean(x)); return isNaN(n)?0:n; }
function clampDay(x){ const d=parseInt(clean(x),10); return isNaN(d)?null:Math.max(1,Math.min(31,d)); }
function r2(n){ return Math.round(n*100)/100; }

/* ================= mois ================= */
function month(ym){
  if(!S.months[ym]){
    const prev=S.months[ymShift(ym,-1)];
    const M={
      steps:{depart:false,repartition:false,cloture:false},
      start:{}, salary:[], receivables:[], charges:[], transfers:[], ops:[], moves:[],
      courses:+S.defaults.courses||0, repasCount:+S.defaults.repasCount||0, repasUnit:+S.defaults.repasUnit||20,
      securite:Object.assign({},S.defaults.securite||{}), close:null
    };
    M.charges=S.recurring.map(t=>({id:uid(),tplId:t.id,label:t.label,amount:t.amount,day:t.day,account:t.account,category:t.category,paid:false}));
    if(S.defaults.salaryLabel) M.salary.push({id:uid(),label:S.defaults.salaryLabel,amount:0,account:S.defaults.salaryAccount||A0(),got:false});
    if(prev && prev.close){
      S.accounts.forEach(a=>{ if(prev.close[a.id]!=null) M.start[a.id]=prev.close[a.id]; });
      const pm=ymShift(ym,-1), rc=(+prev.repasCount||0)*(+prev.repasUnit||0);
      if(rc>0) M.receivables.push({id:uid(),label:"Remboursement paniers repas de "+MONTHS[ymParts(pm).m-1],amount:r2(rc),account:S.defaults.salaryAccount||A0(),got:false,from:pm});
    }
    S.months[ym]=M; persist();
  }
  return S.months[ym];
}

/* ================= projets anticipés ================= */
/* un projet : {id,name,amount,start,buy,by,account,cat,status,doneYm}
   l'argent est mis de côté à parts égales de start à buy (mois d'achat), puis l'achat le consomme */
function projList(){ return S.projects||(S.projects=[]); }
function monthsBetween(a,b){ const L=[]; let m=a; while(m<=b&&L.length<36){ L.push(m); m=ymShift(m,1); } return L; }
function projContrib(p,ym){ if(ym<p.start||ym>p.buy) return 0; const L=monthsBetween(p.start,p.buy), n=L.length, part=Math.floor(p.amount/n*100)/100;
  return ym===p.buy ? r2(p.amount-part*(n-1)) : part; }
function projCum(p,ym){ return monthsBetween(p.start,p.buy).filter(m=>m<=ym).reduce((t,m)=>t+projContrib(p,m),0); }
function projSpent(p,ym,strict){ let t=0; for(const m in S.months){ if(strict?m>=ym:m>ym) continue; S.months[m].ops.forEach(o=>{ if(o.kind==="out"&&o.proj===p.id) t+=+o.amount||0; }); } return t; }
function projDone(p,ym){ return p.status==="done" && p.doneYm && ym>=p.doneYm; }
/* réservé en fin de mois ym (reste dans le compte, pas disponible) */
function projReserve(p,ym){ if(projDone(p,ym)||ym<p.start) return 0; return Math.max(0,projCum(p,ym)-projSpent(p,ym)); }
/* ce que le compte doit garder ce mois : réserve du début de mois + part du mois */
function projNeed(p,ym){ if(projDone(p,ym)||ym<p.start) return 0; return Math.max(0,projCum(p,ym)-projSpent(p,ym,true)); }

/* ================= calculs ================= */
/* un prélèvement compte comme passé dès que sa date est arrivée (sauf si on l'a marqué « pas encore passé ») */
function dayPassed(ym,d){ const n=ymNow(); if(ym<n) return true; if(ym>n) return false; return (d||99)<=new Date().getDate(); }
function isPaid(ym,c){ return !!c.paid || (!c.hold && dayPassed(ym,c.day)); }
function calc(ym){
  const M=month(ym);
  const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):(+x.amount||0)),0);
  const A={};
  S.accounts.forEach(a=>{ A[a.id]={id:a.id,start:+M.start[a.id]||0,startSet:M.start[a.id]!=null,income:0,incomeGot:0,recv:0,recvGot:0,
    charges:0,chargesPaid:0,chargesDue:[],trIn:0,trOut:0,trInDone:0,trOutDone:0,out:0,outSeen:0,inn:0,innSeen:0,extra:0,
    savedOut:0,sec:+(M.securite||{})[a.id]||0,autres:0,pendingOut:0,pendingIn:0,nPending:0}; });
  const g=id=>A[id]||(A[id]={id,start:0,startSet:false,income:0,incomeGot:0,recv:0,recvGot:0,charges:0,chargesPaid:0,chargesDue:[],trIn:0,trOut:0,trInDone:0,trOutDone:0,out:0,outSeen:0,inn:0,innSeen:0,extra:0,savedOut:0,sec:0,autres:0,pendingOut:0,pendingIn:0,nPending:0});

  M.salary.forEach(s=>{ const a=g(s.account); a.income+=+s.amount||0; if(s.got) a.incomeGot+=+s.amount||0; });
  M.receivables.forEach(s=>{ const a=g(s.account); a.recv+=+s.amount||0; if(s.got) a.recvGot+=+s.amount||0; });
  M.charges.forEach(c=>{ const a=g(c.account); a.charges+=+c.amount||0; if(isPaid(ym,c)) a.chargesPaid+=+c.amount||0; else a.chargesDue.push(c); });
  M.transfers.forEach(t=>{ const f=g(t.from), to=g(t.to), v=+t.amount||0; f.trOut+=v; to.trIn+=v; if(t.done){f.trOutDone+=v; to.trInDone+=v;} });
  M.moves.forEach(m=>{ const a=g(m.account); a.savedOut+=(m.kind==="in"?1:-1)*(+m.amount||0); });

  // remboursements liés : net par opération
  const refundsOf={};
  M.ops.filter(o=>o.kind==="in"&&o.refundOf).forEach(o=>{ refundsOf[o.refundOf]=(refundsOf[o.refundOf]||0)+(+o.amount||0); });
  let spentCourses=0, spentRepas=0, nRepas=0, extraTot=0, toRefund=0, nToRefund=0, projSpentM=0;
  const byCat={};
  M.ops.forEach(o=>{
    const a=g(o.account), v=+o.amount||0;
    if(o.kind==="out"){
      a.out+=v; if(o.seen) a.outSeen+=v; else { a.pendingOut+=v; a.nPending++; }
      const net=Math.max(0,v-(refundsOf[o.id]||0)), p=cat(o.category).pocket;
      if(o.proj){ projSpentM+=net; return; }   // achat d'un projet anticipé : payé par sa réserve, hors plafonds
      byCat[o.category]=(byCat[o.category]||0)+net;
      if(cat(o.category).refund && net>0.005){ toRefund+=net; nToRefund++; }
      if(p==="courses") spentCourses+=net; else if(p==="repas"){ spentRepas+=net; nRepas++; } else a.autres+=net;
    }else{
      a.inn+=v; if(o.seen) a.innSeen+=v; else { a.pendingIn+=v; a.nPending++; }
      if(!o.refundOf){ a.extra+=v; extraTot+=v; }
    }
  });
  M.ops.forEach(o=>{ o._refunded=refundsOf[o.id]||0; });

  // par compte
  let dispo=0, fixed=0, prot=0, secTot=0;
  Object.values(A).forEach(a=>{
    a.real = a.start + a.income + a.recv + a.extra + a.trIn - a.trOut - a.charges - a.out + (a.inn - a.extra) - a.savedOut;
    a.bank = a.start + a.incomeGot + a.recvGot + a.trInDone - a.trOutDone - a.chargesPaid - a.outSeen + a.innSeen - a.savedOut;
    a.pending = a.pendingOut - a.pendingIn;
    a.secLeft = Math.max(0, a.sec - a.autres);
    a.secOver = Math.max(0, a.autres - a.sec);
    a.over = acc(a.id)?+acc(a.id).overdraft||0:0;
    dispo += a.start + a.income + a.recv + a.extra;
    fixed += a.charges; prot += a.secLeft; secTot += a.sec;
  });
  const courses=+M.courses||0, repas=(+M.repasCount||0)*(+M.repasUnit||0);
  const coursesLeft=Math.max(0,courses-spentCourses), repasLeft=Math.max(0,repas-spentRepas);
  prot += coursesLeft + repasLeft;
  // réserves des projets anticipés (argent qui doit rester sur les comptes)
  let projRes=0; projList().forEach(p=>{ const r=projReserve(p,ym); projRes+=r; if(A[p.account]) A[p.account].projRes=(A[p.account].projRes||0)+r; });
  prot += projRes;
  const spentAll = spentCourses + spentRepas + Object.values(A).reduce((t,a)=>t+a.autres,0);
  const savedNet = sum(M.moves, m=>(m.kind==="in"?1:-1)*(+m.amount||0));
  const epargnePossible = dispo - fixed - spentAll - projSpentM - prot;
  const reste = epargnePossible - savedNet;
  const salaryTot=sum(M.salary), recvTot=sum(M.receivables);
  const startTot=Object.values(A).reduce((t,a)=>t+a.start,0);
  const pendingTot=Object.values(A).reduce((t,a)=>t+a.pending,0), nPending=Object.values(A).reduce((t,a)=>t+a.nPending,0);
  return {A,dispo,fixed,spentAll,prot,savedNet,epargnePossible,reste,courses,spentCourses,coursesLeft,repas,spentRepas,repasLeft,nRepas,
          salaryTot,recvTot,extraTot,startTot,secTot,pendingTot,nPending,byCat,toRefund,nToRefund,projSpentM,projRes};
}

/* besoin de chaque compte et proposition de virements */
function needs(ym){
  const M=month(ym), C=calc(ym), out={};
  S.accounts.forEach(a=>{
    const x=C.A[a.id];
    const pockets=[];
    if(a.id===(S.defaults.coursesAccount||A0()) && C.courses>0) pockets.push({label:"enveloppe courses",amount:C.courses});
    if(a.id===(S.defaults.salaryAccount||A0()) && C.repas>0) pockets.push({label:"paniers repas ("+M.repasCount+" × "+eur0(M.repasUnit)+")",amount:C.repas});
    if(x.sec>0) pockets.push({label:"sécurité",amount:x.sec});
    const pj=projList().filter(p=>p.account===a.id&&projNeed(p,ym)>0.005);
    if(pj.length) pockets.push({label:"projets ("+pj.map(p=>p.name).join(", ")+")",amount:r2(pj.reduce((t,p)=>t+projNeed(p,ym),0))});
    const need = x.charges + pockets.reduce((t,p)=>t+p.amount,0);
    const has  = x.start + x.income + x.recv;
    out[a.id]={need,has,pockets,charges:x.charges,gap:need-has};
  });
  return out;
}
function proposeTransfers(ym){
  const M=month(ym), N=needs(ym), src=S.defaults.salaryAccount||A0();
  const keep=M.transfers.filter(t=>t.done||t.manual), net={};
  keep.forEach(t=>{ net[t.to]=(net[t.to]||0)+(+t.amount||0); net[t.from]=(net[t.from]||0)-(+t.amount||0); });
  const list=[];
  S.accounts.forEach(a=>{ if(a.id===src) return; const g=r2(N[a.id].gap-(net[a.id]||0)); if(g>0.005) list.push({id:uid(),from:src,to:a.id,amount:g,done:false}); });
  M.transfers=keep.concat(list); M.steps.repartition=false; persist();
}

/* prévisionnel d'un compte : solde d'aujourd'hui puis chaque mouvement attendu jusqu'à la fin du mois */
function forecast(ym,aid){
  const M=month(ym), C=calc(ym), x=C.A[aid]; if(!x) return null;
  const now=x.bank-x.pending, ev=[];
  M.salary.filter(s=>!s.got&&(+s.amount||0)>0&&s.account===aid).forEach(s=>ev.push({o:0,day:null,when:"à réception",label:s.label+" attendu",amt:+s.amount,kind:"in",act:`editSalary('${s.id}',{got:'1'})`}));
  M.receivables.filter(s=>!s.got&&s.account===aid).forEach(s=>ev.push({o:1,day:null,when:"à réception",label:s.label,amt:+s.amount,kind:"in",act:`editReceivable('${s.id}')`}));
  M.transfers.filter(t=>!t.done&&(t.to===aid||t.from===aid)).forEach(t=>ev.push({o:2,day:null,when:"à faire",label:t.to===aid?`Virement depuis ${accName(t.from)}`:`Virement vers ${accName(t.to)}`,amt:t.to===aid?+t.amount:-t.amount,kind:"tr",act:`toggleTransfer('${t.id}')`}));
  x.chargesDue.slice().sort((a,b)=>(a.day||99)-(b.day||99)).forEach(c=>ev.push({o:3,day:c.day,when:"le "+(c.day||"?"),label:c.label,amt:-(+c.amount||0),kind:"ch",act:`editCharge('${c.id}')`}));
  const env=[];
  if(aid===(S.defaults.coursesAccount||A0()) && C.coursesLeft>0) env.push("courses "+eur0(C.coursesLeft));
  if(aid===(S.defaults.salaryAccount||A0()) && C.repasLeft>0) env.push("paniers "+eur0(C.repasLeft));
  if(x.secLeft>0) env.push("sécurité "+eur0(x.secLeft));
  let envTot=(aid===(S.defaults.coursesAccount||A0())?C.coursesLeft:0)+(aid===(S.defaults.salaryAccount||A0())?C.repasLeft:0)+x.secLeft;
  if(envTot>0.005) ev.push({o:4,day:null,when:"d'ici la fin du mois",label:"Enveloppes à dépenser ("+env.join(", ")+")",amt:-envTot,kind:"env"});
  // projets : achat prévu ce mois (sort du compte), sinon l'argent reste réservé
  let kept=0; const keptN=[];
  projList().filter(p=>p.account===aid&&!projDone(p,ym)&&ym>=p.start).forEach(p=>{
    const r=Math.max(0,projCum(p,ym)-projSpent(p,ym));
    if(p.buy<=ym && r>0.005) ev.push({o:3.5,day:p.by||null,when:p.by?"avant le "+p.by:"ce mois-ci",label:"À acheter : "+p.name,amt:-r,kind:"proj",act:`buyProject('${p.id}')`});
    else if(r>0.005){ kept+=r; keptN.push(p.name); }
  });
  ev.sort((a,b)=>(a.o===3||a.o===3.5)&&(b.o===3||b.o===3.5)?((a.day||99)-(b.day||99)):a.o-b.o);
  let bal=now; ev.forEach(e=>{ bal+=e.amt; e.bal=bal; });
  const lowest=ev.reduce((m,e)=>Math.min(m,e.bal),now);
  return {now,ev,end:bal,lowest,over:x.over,kept,keptN,hasPendingIn:ev.some(e=>e.kind==="in"||(e.kind==="tr"&&e.amt>0))};
}
/* projection d'un compte jusqu'à la fin du mois */
function project(ym,aid){
  const C=calc(ym), a=C.A[aid]; if(!a) return null;
  const t=today(); let bal=a.bank - a.pending; const seq=[];
  a.chargesDue.slice().sort((x,y)=>(x.day||99)-(y.day||99)).forEach(c=>{ bal-=+c.amount||0; seq.push({day:c.day,label:c.label,bal}); });
  const first=seq.find(s=>s.bal<0), bad=seq.find(s=>s.bal<-a.over);
  return {first,bad,end:bal,over:a.over};
}

/* ================= rendu ================= */
const view=document.getElementById("view");
function render(){ try{ renderInner(); }catch(e){ showCrash(e); } }
function showCrash(e){
  console.error(e);
  view.innerHTML=`<div class="alarm"><div class="kick">Erreur d'affichage</div><div class="tt" style="font-size:18px">Quelque chose a planté</div>
    <div class="tx">Fais une capture de cet écran et envoie-la à Claude.<br><br><span style="font-family:var(--mono);font-size:12px">${esc(e&&e.message||e)}<br>${esc(String(e&&e.stack||"").split("\n").slice(0,3).join(" / "))}<br>${APP_VERSION}</span></div></div>
    <button class="btn ghost" onclick="tab='reglages';render()">Ouvrir les réglages (export / import)</button>`;
}
window.addEventListener("error",ev=>{ if(ev&&ev.message&&!/ServiceWorker/i.test(ev.message)) toast("Erreur : "+esc(ev.message)); });
function renderInner(){

  document.getElementById("mLabel").textContent=MONTHS[m-1]+" "+y;
  document.getElementById("mSub").textContent=isCur()?"mois en cours":(cur<ymNow()?"mois passé":"mois à venir");
  document.getElementById("fab").style.display=(tab==="reglages")?"none":"grid";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  view.innerHTML=({today:vToday,fil:vFil,mois:vMois,stats:vStats,env:vEnv,epargne:vEpargne,reglages:vReglages})[tab]();
  window.scrollTo(0,0);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ document.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%"); }));
  // pastille rouge sur l'onglet Aujourd'hui + grande alerte si une nouvelle alerte grave apparaît
  const nowYm=ymNow(), crit=S.months[nowYm]?alerts(nowYm).filter(a=>a.lvl==="crit"):[];
  const tb=document.querySelector('nav button[data-tab="today"]'); let bd=tb.querySelector(".badge");
  if(crit.length){ if(!bd){ bd=document.createElement("span"); bd.className="badge"; tb.appendChild(bd); } bd.textContent=crit.length; } else if(bd) bd.remove();
  S.alertSeen=S.alertSeen||{}; const seen=S.alertSeen[nowYm]||[];
  const fresh=crit.filter(a=>!seen.includes(a.id));
  if(fresh.length){ S.alertSeen[nowYm]=seen.concat(fresh.map(a=>a.id)); persist(); setTimeout(()=>bigAlert(fresh[0],fresh.length-1),380); }
  const soft=S.months[nowYm]?alerts(nowYm).filter(a=>a.level&&a.level<3&&!seen.includes(a.id)):[];
  if(soft.length&&!fresh.length){ S.alertSeen[nowYm]=(S.alertSeen[nowYm]||[]).concat(soft.map(a=>a.id)); persist();
    const a=soft.sort((x,y)=>y.level-x.level)[0]; setTimeout(()=>toast(`<b style="color:${a.level===2?"#FFB25C":"#F2DA6B"}">● ${a.level===2?"Alerte intermédiaire":"Alerte minimale"}</b><br>${esc(a.title)}<br>${esc(a.text)}`),420); }
}

function gauge(a){
  const lo=-Math.max(a.over,1), hi=Math.max(a.start+a.income+a.recv+a.trIn, a.real, a.bank, 100);
  const span=hi-lo, pct=v=>Math.max(0,Math.min(100,(v-lo)/span*100));
  const z=pct(0), rp=pct(a.real), bp=pct(a.bank);
  const neg=a.real<0;
  return `<div class="g">
    <div class="neg" style="width:${z}%"></div>
    <div class="fill ${neg?"red":""}" style="left:${neg?rp:z}%" data-w="${Math.abs(rp-z)}"></div>
    <div class="zero" style="left:${z}%"></div>
    ${Math.abs(bp-rp)>0.5?`<div class="bank" style="left:${bp}%"></div>`:""}
  </div>`;
}
let openAcc=new Set();
function toggleAcc(id){ if(openAcc.has(id)) openAcc.delete(id); else openAcc.add(id); const y=window.scrollY; render(); window.scrollTo(0,y); }
/* jauge : remplissage = aujourd'hui, trait ambre = fin de mois prévue */
function gauge2(F,over){
  const lo=-Math.max(over,1), hi=Math.max(F.now,F.end,...F.ev.map(e=>e.bal),100), span=hi-lo, pct=v=>Math.max(0,Math.min(100,(v-lo)/span*100));
  const z=pct(0), np=pct(F.now), ep=pct(F.end), neg=F.now<0;
  return `<div class="g"><div class="neg" style="width:${z}%"></div>
    <div class="fill ${neg?"red":""}" style="left:${neg?np:z}%" data-w="${Math.abs(np-z)}"></div>
    <div class="zero" style="left:${z}%"></div><div class="bank" style="left:${ep}%;width:3px"></div></div>`;
}

function capsCard(C){
  const caps=S.categories.filter(c=>(+c.budget||0)>0);
  if(!caps.length && !C.toRefund) return "";
  let totB=0, totS=0;
  const rows=caps.map(c=>{ const b=+c.budget, s=C.byCat[c.id]||0; totB+=b; totS+=Math.min(s,b)+Math.max(0,s-b);
    const pc=Math.min(100,s/b*100), lv=capLevel(s,b), cls="";
    return `<div class="cap" onclick="editCategory('${c.id}')"><div class="h"><span>${esc(c.name)}</span>
      <span class="a ${s>b?"minus":""}" style="${s>b?"color:var(--alert)":""}">${eur0(s)} <small>/ ${eur0(b)}</small></span></div>
      <div class="bar"><i style="background:${LV_COL[lv]}" data-w="${pc.toFixed(1)}"></i></div><div class="ticks"><i style="left:50%"></i><i style="left:70%"></i><i style="left:90%"></i></div>
      ${lv&&lv<4?`<div class="hint" style="margin-top:4px;color:${LV_COL[lv]};font-weight:600">${LV_TXT[lv]}</div>`:``}
      ${s>b?`<div class="hint" style="margin-top:4px;color:var(--alert)">Dépassé de ${eur0(s-b)}</div>`:``}</div>`; }).join("");
  return `<div class="card">
    <div class="sec"><span class="eyebrow">Plafonds du mois</span>${caps.length?`<span class="num" style="font-size:12.5px;color:${totS>totB?"var(--alert)":"var(--ink-2)"}">${eur0(totS)} / ${eur0(totB)}</span>`:``}</div>
    ${rows}
    ${C.toRefund>0?`<div class="calc" style="margin-top:6px"><div class="l" style="border-top:1px solid var(--line-soft)"><span class="n">À te faire rembourser<small>${C.nToRefund} dépense${C.nToRefund>1?"s":""} santé ou frais pro sans remboursement complet. Pense aux notes de frais.</small></span><span class="a" style="color:var(--amber)">${eur(C.toRefund)}</span></div></div>`:``}
    ${caps.length?`<div class="hint">Touche une ligne pour changer son plafond.</div>`:``}
  </div>`;
}

/* plan d'octobre 2026 (recommandations de l'analyse de septembre) */
const PLAN_ID="2026-10";
function planBanner(){
  if(S.plan===PLAN_ID || S.plan==="dismiss-"+PLAN_ID) return "";
  if(!S.months["2026-09"] && !S.months["2026-10"]) return "";
  return `<div class="card" style="border-color:var(--teal)">
    <span class="eyebrow" style="color:var(--teal)">Plan d'octobre prêt</span>
    <div style="font-size:14px;line-height:1.5;margin-bottom:12px">
      Plafonds par catégorie (restos et snacks 100 €, déplacements 150 €, santé 60 €, livres 40 €, divers 60 €), courses à 400 €,
      Total Énergie à 131 €, Box meubles à 140 € et Bouygues à 18 €, et les virements internes de septembre rangés comme de vrais virements.
    </div>
    <div class="btnrow"><button class="btn sm ghost" onclick="dismissPlan()">Plus tard</button><button class="btn sm teal" onclick="applyPlan()">Appliquer</button></div>
  </div>`;

function dismissPlan(){ S.plan="dismiss-"+PLAN_ID; persist(); render(); }
function applyPlan(){
  const getCat=(id,name)=>{ let c=S.categories.find(x=>x.id===id); if(!c){ c={id,name,pocket:"securite",refund:false}; const i=S.categories.findIndex(x=>x.id==="c-vet"); S.categories.splice(i<0?S.categories.length:i,0,c); } return c; };
  getCat("c-resto","Restos & snacks").name="Restos & snacks";
  const caps={"c-resto":100,"c-carb":80,"c-transp":70,"c-sante":60,"c-livres":40,"c-divers":30,"c-vet":15,"c-cadeaux":15};
  getCat("c-livres","Livres");
  Object.keys(caps).forEach(id=>{ const c=S.categories.find(x=>x.id===id); if(c) c.budget=caps[id]; });
  const secTot=Object.values(caps).reduce((a,b)=>a+b,0), ca=S.defaults.coursesAccount||A0();
  S.defaults.courses=400; S.defaults.securite=S.defaults.securite||{}; S.defaults.securite[ca]=secTot;
  // montants réels des prélèvements
  const fix=AMOUNTS_OCT;
  S.recurring.forEach(t=>{ const v=fix[t.label.trim().toLowerCase()]; if(v!=null){ t.amount=v;
    for(const ym in S.months) if(ym>=PLAN_ID) S.months[ym].charges.forEach(c=>{ if(c.tplId===t.id && !c.paid) c.amount=v; }); } });
  for(const ym in S.months){ if(ym<PLAN_ID) continue; const M=S.months[ym]; M.courses=400; M.securite=M.securite||{}; M.securite[ca]=secTot; }
  // ménage : virements saisis comme opérations -> vrais virements ; rentrées qui remboursent une dépense identique -> liées
  let nTr=0, nRef=0;
  for(const ym in S.months){ if(ym<"2026-09") continue; const M=S.months[ym];
    const isV=o=>/vi[rv]ement/i.test(o.label||"");
    M.ops.filter(o=>o.kind==="in"&&isV(o)).forEach(i=>{
      const o=M.ops.find(x=>x.kind==="out"&&isV(x)&&x.account!==i.account&&Math.abs((+x.amount||0)-(+i.amount||0))<0.005&&!x._pair);
      if(o){ o._pair=i._pair=true; M.transfers.push({id:uid(),from:o.account,to:i.account,amount:+i.amount,done:true,day:i.day}); nTr++; } });
    M.ops=M.ops.filter(o=>!o._pair);
    M.ops.filter(o=>o.kind==="in"&&!o.refundOf&&/rembours|cpam|mutuelle|alara|note de frais/i.test(o.label||"")).forEach(i=>{
      const o=M.ops.find(x=>x.kind==="out"&&x.category===i.category&&Math.abs((+x.amount||0)-(+i.amount||0))<0.005&&(x.day||0)<=(i.day||0)&&!M.ops.some(y=>y.refundOf===x.id));
      if(o){ i.refundOf=o.id; nRef++; } });
  }
  S.plan=PLAN_ID; persist(); render();
  toast(`Plan appliqué · plafonds en place${nTr?` · ${nTr} virement${nTr>1?"s":""} reclassé${nTr>1?"s":""}`:""}${nRef?` · ${nRef} remboursement${nRef>1?"s":""} relié${nRef>1?"s":""}`:""}`);
}

/* ================= alertes ================= */
/* niveaux d'une enveloppe : 1 = 50 % (minimale), 2 = 70 % (intermédiaire), 3 = 90 % (maximale), 4 = dépassée */
function capLevel(s,b){ if(!(b>0)) return 0; const r=s/b; return r>1?4:r>=0.9?3:r>=0.7?2:r>=0.5?1:0; }
const LV_COL=["var(--teal)","#C9A227","var(--amber)","var(--alert)","var(--alert)"];
const LV_TXT=["","50 % · alerte minimale","70 % · alerte intermédiaire","90 % · alerte maximale","dépassée"];
function varBudget(C){ const caps=S.categories.filter(c=>c.pocket==="securite").reduce((t,c)=>t+(+c.budget||0),0); return C.courses+C.repas+(caps||C.secTot); }
function alerts(ym){
  const C=calc(ym), M=month(ym), L=[], isNow=ym===ymNow(), dim=daysIn(ym), t=isNow?Math.min(new Date().getDate(),dim):dim;
  const startsOk=S.accounts.every(a=>M.start[a.id]!=null);
  if(!startsOk) L.push({id:"start",lvl:"warn",title:"Soldes de départ à saisir",text:"Les alertes de découvert s'activent une fois les soldes du 1er notés dans Le mois."});
  if(startsOk) S.accounts.forEach(a=>{ const x=C.A[a.id], p=isNow?project(ym,a.id):null;
    // ce qui doit encore arriver sur ce compte : virements prévus non faits, salaire et sommes attendus
    const sum=(arr,f)=>arr.filter(f).reduce((s,o)=>s+(+o.amount||0),0);
    const trIn=sum(M.transfers,t=>!t.done&&t.to===a.id), trOut=sum(M.transfers,t=>!t.done&&t.from===a.id);
    const salIn=sum(M.salary,s=>!s.got&&s.account===a.id)+sum(M.receivables,s=>!s.got&&s.account===a.id);
    const cover=trIn+salIn-trOut;
    if(x.real < -x.over) L.push({id:"over-"+a.id,lvl:"crit",title:`${a.name} au-delà du découvert`,text:`Le solde est à ${eur(x.real)} pour un découvert autorisé de ${eur0(x.over)}. Fais un virement dès aujourd'hui pour éviter les frais.`});
    else if(p&&p.bad){
      if(p.bad.bal+cover >= -x.over){
        const what=trIn>0?`le virement prévu de ${eur0(trIn)} depuis ${M.transfers.filter(t=>!t.done&&t.to===a.id).map(t=>accName(t.from)).join(", ")}`:`le salaire attendu (${eur0(salIn)})`;
        L.push({id:"todo-"+a.id,lvl:"warn",title:`${a.name} : ${trIn>0?"virement à faire":"salaire attendu"} avant le ${p.bad.day}`,text:`Sans ${what}, ${p.bad.label} ferait passer le compte à ${eur(p.bad.bal)}.`});
      } else L.push({id:"proj-"+a.id,lvl:"crit",title:`${a.name} : découvert dépassé le ${p.bad.day}`,text:`${p.bad.label} fera passer le compte à ${eur(p.bad.bal)}, et les rentrées prévues ne suffisent pas à le couvrir. Prévois un virement supplémentaire avant cette date.`});
    }
    else if(x.real<0) L.push({id:"neg-"+a.id,lvl:"warn",title:`${a.name} à découvert`,text:`${eur(x.real)}, encore dans la limite autorisée.`});
  });
  const left=Math.max(1,dim-t+(isNow?1:0));
  const envAlert=(key,name,s,b)=>{ const lv=capLevel(s,b), pc=Math.round(s/b*100), rest=b-s;
    if(lv===4) L.push({id:"cap100-"+key,lvl:"crit",level:4,title:`${name} : enveloppe dépassée`,text:`${eur0(s)} dépensés pour ${eur0(b)} prévus, soit ${eur0(s-b)} de trop. On ne dépense plus rien dans cette catégorie ce mois-ci.`});
    else if(lv===3) L.push({id:"cap90-"+key,lvl:"crit",level:3,title:`${name} : ${pc} %, alerte maximale`,text:`Il ne reste que ${eur0(rest)} sur ${eur0(b)}. Stop sur cette catégorie jusqu'à la fin du mois.`});
    else if(lv===2) L.push({id:"cap70-"+key,lvl:"warn",level:2,title:`${name} : ${pc} % utilisés`,text:`Il reste ${eur0(rest)}${isNow?`, soit environ ${eur0(rest/left)} par jour sur ${left} jours`:""}. On ralentit.`});
    else if(lv===1) L.push({id:"cap50-"+key,lvl:"info",level:1,title:`${name} : moitié de l'enveloppe`,text:`${eur0(s)} sur ${eur0(b)}, il reste ${eur0(rest)}.`}); };
  if(C.courses>0) envAlert("courses","Courses",C.spentCourses,C.courses);
  S.categories.filter(c=>(+c.budget||0)>0).forEach(c=>envAlert(c.id,c.name,C.byCat[c.id]||0,+c.budget));
  // projets anticipés : rappels d'achat
  if(isNow) projList().filter(p=>!projDone(p,ym)&&p.start<=ym).forEach(p=>{
    if(p.buy<ym) L.push({id:"projlate-"+p.id,lvl:"crit",title:`${p.name} : pas encore acheté`,text:`L'achat était prévu en ${MONTHS[ymParts(p.buy).m-1]}. Plus on attend, plus les prix montent. Si c'est fait, touche « Acheté » dans Enveloppes.`});
    else if(p.buy===ym){ const by=p.by||dim;
      if(t>by) L.push({id:"projby-"+p.id,lvl:"crit",title:`${p.name} : date limite passée`,text:`Il fallait réserver avant le ${by}. Réserve au plus vite pour limiter la hausse des prix.`});
      else if(by-t<=7) L.push({id:"projsoon-"+p.id,lvl:"warn",title:`${p.name} : à réserver avant le ${by}`,text:`${eur0(Math.max(0,projCum(p,ym)-projSpent(p,ym)))} sont réservés pour ça. Réserver tôt, c'est payer moins cher.`});
      else L.push({id:"projmonth-"+p.id,lvl:"info",title:`${p.name} : à acheter ce mois-ci`,text:`${eur0(p.amount)} prévus${p.by?`, avant le ${p.by}`:""}. Les prix montent en approchant de la date.`}); }
  });
  const B=varBudget(C);
  if(isNow && t>=7 && B>0){ const proj=C.spentAll/t*dim; if(proj>B*1.1) L.push({id:"pace",lvl:"crit",title:"Tu dépenses trop vite",text:`À ce rythme, le mois finira à ${eur0(proj)} de dépenses au lieu des ${eur0(B)} prévus, soit ${eur0(proj-B)} de trop. Il faudrait rester sous ${eur0(Math.max(0,(B-C.spentAll)/Math.max(1,dim-t)))} par jour jusqu'à la fin du mois.`}); }
  if(M.steps.depart && C.reste<-1) L.push({id:"rouge",lvl:"crit",title:"Le mois finit dans le rouge",text:`Il manque ${eur0(-C.reste)} pour couvrir les prélèvements et les enveloppes. Sans changement, il faudra puiser dans l'épargne.`});
  const lep=M.moves.filter(m=>m.kind==="out").reduce((s,m)=>s+(+m.amount||0),0);
  if(lep>0) L.push({id:"lep",lvl:"warn",title:`${eur0(lep)} repris sur l'épargne ce mois-ci`,text:`Pense à les remettre dès qu'un mois le permet.`});
  return L;
}

function alarmBlock(){
  if(!isCur()) return "";
  const L=alerts(cur), crit=L.filter(a=>a.lvl==="crit"), warn=L.filter(a=>a.lvl==="warn"), info=L.filter(a=>a.lvl==="info");
  let h="";
  if(crit.length){ const f=crit[0];
    h+=`<div class="alarm" role="alert"><div class="kick">Alerte${crit.length>1?` · ${crit.length}`:""}</div>
      <div class="top"><div class="ic">!</div><div><div class="tt">${esc(f.title)}</div><div class="tx">${esc(f.text)}</div></div></div>
      ${crit.length>1?`<div class="more">${crit.slice(1).map(a=>`<div><b>${esc(a.title)}</b> · ${esc(a.text)}</div>`).join("")}</div>`:""}
    </div>`; }
  if(warn.length) h+=`<div class="warns">${warn.map(a=>`<div><b>${esc(a.title)}</b> · ${esc(a.text)}</div>`).join("")}</div>`;
  if(info.length) h+=`<div class="infos">${info.map(a=>`<div><b>${esc(a.title)}</b> · ${esc(a.text)}</div>`).join("")}</div>`;
  return h;
}

/* ================= enveloppes ================= */
/* recalcule les virements proposés (pas encore faits) quand le besoin des comptes change */
function refreshProposals(){ const M=month(cur); if(cur<ymNow()||!M.steps.depart) return; if(M.transfers.some(t=>!t.done&&!t.manual)||!M.transfers.length) proposeTransfers(cur); }
function capsTotal(){ return S.categories.filter(c=>c.pocket==="securite").reduce((t,c)=>t+(+c.budget||0),0); }
/* garde l'enveloppe sécurité du compte des courses égale à la somme des plafonds */
function syncSec(){ const tot=capsTotal(); if(!tot) return; const ca=S.defaults.coursesAccount||A0();
  S.defaults.securite=S.defaults.securite||{}; S.defaults.securite[ca]=tot;
  for(const ym in S.months) if(ym>=ymNow()){ const M=S.months[ym]; M.securite=M.securite||{}; M.securite[ca]=tot; } }
function bumpCap(id,d){ const c=S.categories.find(x=>x.id===id); if(!c) return; c.budget=Math.max(0,(+c.budget||0)+d); syncSec(); refreshProposals(); persist(); const y=scrollY; render(); scrollTo(0,y); }
function bumpCourses(d){ const M=month(cur); M.courses=Math.max(0,(+M.courses||0)+d); if(cur>=ymNow()) S.defaults.courses=M.courses; refreshProposals(); persist(); const y=scrollY; render(); scrollTo(0,y); }
function envRow(name,s,b,minus,plus,edit,sub){
  const lv=capLevel(s,b), pc=b>0?Math.min(100,s/b*100):0;
  return `<div class="cap"><div class="h"><span onclick="${edit}" style="flex:1">${esc(name)}${sub?`<small style="display:block;font-size:11.5px;color:var(--ink-3)">${sub}</small>`:""}</span>
    <span style="display:flex;align-items:center;gap:6px;flex:none">
      <button class="chk" style="width:30px;height:30px;color:var(--ink);font-size:17px" onclick="${minus}" aria-label="Moins">−</button>
      <span class="a" style="min-width:74px;text-align:center" onclick="${edit}">${b>0?eur0(b):"aucun"}</span>
      <button class="chk" style="width:30px;height:30px;color:var(--ink);font-size:17px" onclick="${plus}" aria-label="Plus">+</button></span></div>
    ${b>0?`<div class="bar"><i style="background:${LV_COL[lv]}" data-w="${pc.toFixed(1)}"></i></div><div class="ticks"><i style="left:50%"></i><i style="left:70%"></i><i style="left:90%"></i></div>
    <div class="hint" style="margin-top:5px;display:flex;justify-content:space-between"><span>${eur0(s)} dépensés · reste ${eur0(Math.max(0,b-s))}</span><span style="color:${LV_COL[lv]};font-weight:600">${lv?LV_TXT[lv]:Math.round(s/b*100)+" %"}</span></div>`
      :`<div class="hint" style="margin-top:4px">${eur0(s)} dépensés · pas de plafond, touche + pour en mettre un</div>`}</div>`;
}
function vEnv(){
  const M=month(cur), C=calc(cur);
  const income=C.salaryTot+C.recvTot+C.extraTot, start=C.startTot;
  const caps=capsTotal()||C.secTot, projNeedTot=projList().reduce((t,p)=>t+projNeed(p,cur),0), projSpentNow=C.projSpentM;
  const left=start+income-C.fixed-C.courses-C.repas-caps-projNeedTot;
  const cats=S.categories.filter(c=>c.pocket==="securite");
  const open=projList().filter(p=>!projDone(p,cur)), done=projList().filter(p=>projDone(p,cur)&&p.doneYm===cur);
  return `
  <div class="card">
    <span class="eyebrow">Répartition de ${MONTHS[ymParts(cur).m-1]}</span>
    <div class="calc">
      <div class="l"><span class="n">Soldes du 1er + salaire et rentrées</span><span class="a plus">${eur(start+income)}</span></div>
      <div class="l"><span class="n">Prélèvements</span><span class="a minus">−${eur(C.fixed)}</span></div>
      <div class="l"><span class="n">Courses${C.repas?" et paniers":""}</span><span class="a minus">−${eur(C.courses+C.repas)}</span></div>
      <div class="l"><span class="n">Enveloppes (plafonds)</span><span class="a minus">−${eur(caps)}</span></div>
      ${projNeedTot>0?`<div class="l"><span class="n">Projets anticipés<small>mis de côté sur les comptes</small></span><span class="a minus">−${eur(projNeedTot)}</span></div>`:""}
      <div class="l res"><span class="n">${left>=0?"Reste pour l'épargne":"Il manque"}</span><span class="a ${left<0?"minus":"plus"}">${eur(Math.abs(left))}</span></div>
    </div>
    <div class="hint">Ajuste les enveloppes avec − et + : le reste se recalcule tout de suite. Les plafonds valent pour tous les mois.</div>
  </div>
  <div class="card">
    <span class="eyebrow">Courses</span>
    ${envRow("Courses",C.spentCourses,C.courses,"bumpCourses(-10)","bumpCourses(10)","editCourses()","pas de 10 €")}
  </div>
  <div class="card">
    <div class="sec"><span class="eyebrow">Enveloppes du mois</span><span class="num" style="font-size:12.5px;color:var(--ink-2)">${eur0(cats.reduce((t,c)=>t+(C.byCat[c.id]||0),0))} / ${eur0(caps)}</span></div>
    ${cats.map(c=>envRow(c.name,C.byCat[c.id]||0,+c.budget||0,`bumpCap('${c.id}',-5)`,`bumpCap('${c.id}',5)`,`editCategory('${c.id}')`,"")).join("")}
    <div class="hint">Alertes : jaune à 50 %, orange à 70 %, rouge en grand à 90 % et au dépassement. Les traits gris sur les barres marquent ces seuils.</div>
    <button class="btn ghost sm" style="margin-top:10px" onclick="editCategory()">+ Nouvelle enveloppe</button>
  </div>
  <div class="card">
    <div class="sec"><span class="eyebrow">Projets anticipés</span><button class="act" onclick="editProject()">+ Projet</button></div>
    ${open.length||done.length?open.concat(done).map(projRow).join(""):`<div class="empty"><b>Aucun projet.</b>Billets de train pour les fêtes, cadeaux de Noël, assurance annuelle… L'app met l'argent de côté chaque mois jusqu'à l'achat.</div>`}
    <div class="hint">Ce que tu achètes pour un projet est payé par sa réserve : ça ne touche ni tes plafonds ni ton rythme de dépenses.</div>
  </div>`;
}
function projRow(p){
  const done=projDone(p,cur), cum=projCum(p,cur), spent=projSpent(p,cur), res=Math.max(0,cum-spent), pc=Math.min(100,cum/p.amount*100);
  const contrib=projContrib(p,cur), buyName=MONTHS[ymParts(p.buy).m-1];
  return `<div class="cap"><div class="h"><span onclick="editProject('${p.id}')" style="flex:1">${esc(p.name)}
      <small style="display:block;font-size:11.5px;color:var(--ink-3)">${done?`acheté ${eur0(spent)} en ${MONTHS[ymParts(p.doneYm).m-1]}`:`achat en ${buyName}${p.by&&p.buy===cur?` · avant le ${p.by}`:""} · ${esc(accName(p.account))}`}</small></span>
      <span class="a">${eur0(p.amount)}</span></div>
    ${done?``:`<div class="bar"><i style="background:var(--teal)" data-w="${pc.toFixed(1)}"></i></div>
    <div class="hint" style="margin-top:5px;display:flex;justify-content:space-between;gap:8px"><span>${eur0(res)} réservés${contrib>0&&p.buy>cur?` · ${eur0(contrib)} ce mois`:""}</span>
      ${p.buy<=cur?`<button class="btn sm teal" style="width:auto;padding:7px 12px" onclick="buyProject('${p.id}')">Acheté</button>`:`<span>${monthsBetween(cur,p.buy).length-1} mois avant l'achat</span>`}</div>`}
  </div>`;
}
function projectsCard(){
  const L=projList().filter(p=>!projDone(p,cur)&&p.start<=cur); if(!L.length) return "";
  return `<div class="card"><div class="sec"><span class="eyebrow">Projets anticipés</span><button class="act" onclick="go('env')">Gérer</button></div>${L.map(projRow).join("")}</div>`;
}
function editProject(id){
  const it=id?projList().find(x=>x.id===id):null, mo=[];
  for(let i=0;i<12;i++){ const ym=ymShift(ymNow(),i); mo.push({v:ym,t:MSHORT[ymParts(ym).m-1]+(ymParts(ym).y!==ymParts(ymNow()).y?" "+String(ymParts(ym).y).slice(2):"")}); }
  openSheet(it?"Modifier le projet":"Nouveau projet anticipé","Une dépense que tu sais devoir faire et qu'il vaut mieux payer tôt (billets, cadeaux, assurance annuelle). L'app la met de côté chaque mois jusqu'au mois d'achat.",
    [{k:"name",label:"Nom",type:"text",ph:"Billets Lille – fêtes"},{k:"amount",label:"Montant prévu",type:"money",ph:"180,00"},
     {k:"buy",label:"Mois où tu paies",type:"chips",options:mo},{k:"by",label:"À réserver avant le (jour, facultatif)",type:"day",ph:"15"},
     {k:"account",label:"Payé depuis",type:"seg",options:accOpts()},
     {k:"cat",label:"Catégorie de la dépense",type:"chips",options:S.categories.map(c=>({v:c.id,t:c.name}))}],
    it?{name:it.name,amount:it.amount,buy:it.buy,by:it.by||"",account:it.account,cat:it.cat}
      :{name:"",amount:"",buy:ymNow(),by:"",account:S.defaults.coursesAccount||A0(),cat:(S.categories.find(c=>c.id==="c-transp")||S.categories[0]).id},
    d=>{ const a=num(d.amount); if(!d.name.trim()){toast("Donne un nom au projet");return false;} if(a<=0){toast("Indique un montant");return false;}
      const o={name:d.name.trim(),amount:a,buy:d.buy||ymNow(),by:clampDay(d.by),account:d.account,cat:d.cat};
      if(it) Object.assign(it,o); else projList().push(Object.assign({id:uid(),start:ymNow(),status:"open"},o));
      refreshProposals();
      const n=monthsBetween(it?it.start:ymNow(),o.buy).length;
      toast(n>1?`${esc(o.name)} : ${eur0(a/n)} mis de côté par mois pendant ${n} mois`:`${esc(o.name)} : ${eur0(a)} réservés ce mois-ci`); },
    it?()=>{ S.projects=projList().filter(x=>x.id!==id); for(const ym in S.months) S.months[ym].ops.forEach(o=>{ if(o.proj===id) delete o.proj; }); }:null);
}
function buyProject(id){
  const p=projList().find(x=>x.id===id); if(!p) return;
  const res=Math.max(0,projCum(p,cur)-projSpent(p,cur));
  openSheet("Acheté : "+p.name,`Réservé : <b class="num">${eur(res)}</b>. Indique le prix payé : la dépense est prise sur la réserve du projet, pas sur tes enveloppes.`,
    [{k:"amount",label:"Prix payé",type:"money"},{k:"account",label:"Payé depuis",type:"seg",options:accOpts()},{k:"day",label:"Jour",type:"day"}],
    {amount:String(res||p.amount).replace(".",","),account:p.account,day:today()},
    d=>{ const a=num(d.amount); if(a<=0){toast("Indique le prix");return false;}
      month(cur).ops.push({id:uid(),kind:"out",amount:a,account:d.account,category:p.cat||"c-divers",label:p.name,day:clampDay(d.day)||today(),seen:false,ts:Date.now(),refundOf:null,proj:p.id});
      p.status="done"; p.doneYm=cur;
      const diff=res-a; toast(diff>=0?`${esc(p.name)} acheté ${eur(a)}<br>${diff>0.5?eur0(diff)+" d'économie, ils repartent vers l'épargne":"Pile dans le budget"}`:`${esc(p.name)} acheté ${eur(a)}<br>${eur0(-diff)} de plus que prévu`); });
}

/* ================= graphiques ================= */
const G={c1:"#3F6DB5",c2:"#D08A1A",c3:"#2A9D84",c4:"#A05FB8",rest:"#C9D3D1"};
function tipAttr(s){ return `data-tip="${esc(s)}"`; }
// un mois n'entre dans la comparaison que s'il a un salaire saisi et des dépenses (sinon le résultat ne veut rien dire)
function monthsWithData(){ return Object.keys(S.months).sort().filter(ym=>ym<=ymNow() && S.months[ym].ops.length>0 && S.months[ym].salary.some(s=>(+s.amount||0)>0)); }
function vStats(){
  const M=month(cur), C=calc(cur), dim=daysIn(cur), isNow=isCur(), t=isNow?Math.min(new Date().getDate(),dim):dim;
  const B=varBudget(C), {m}=ymParts(cur), mName=MONTHS[m-1];

  // 1. rythme : cumul jour par jour
  const daily=new Array(dim+1).fill(0);
  M.ops.forEach(o=>{ const d=Math.min(dim,Math.max(1,o.day||1)); if(o.kind==="out") daily[d]+=+o.amount||0; else if(o.refundOf) daily[d]-=+o.amount||0; });
  const cum=[0]; for(let d=1;d<=dim;d++) cum[d]=cum[d-1]+daily[d];
  const spent=cum[t], ideal=B*t/dim, proj=t>0?spent/t*dim:0;
  const W=340,H=170,pl=36,pr=8,pt=10,pb=22, ymax=Math.max(B,proj,spent,100)*1.08;
  const X=d=>pl+(d-1)/(dim-1)*(W-pl-pr), Y=v=>pt+(1-v/ymax)*(H-pt-pb);
  const ticks=[0,ymax/2,ymax].map(v=>Math.round(v/50)*50);
  let path=""; for(let d=1;d<=t;d++) path+=(d===1?"M":"L")+X(d).toFixed(1)+","+Y(cum[d]).toFixed(1);
  const over=spent>ideal*1.05;
  const pace=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dépenses cumulées du mois comparées au budget" id="paceSvg">
    ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-soft)"/><text x="${pl-5}" y="${Y(v)+3}" text-anchor="end">${nf0.format(v)}</text>`).join("")}
    ${B>0?`<line x1="${X(1)}" y1="${Y(0)}" x2="${X(dim)}" y2="${Y(B)}" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="${X(dim)}" y="${Y(B)-6}" text-anchor="end">budget ${eur0(B)}</text>`:""}
    ${isNow&&t<dim&&t>=3?`<line x1="${X(t)}" y1="${Y(spent)}" x2="${X(dim)}" y2="${Y(proj)}" stroke="${over?"var(--alert)":G.c1}" stroke-width="2" stroke-dasharray="2 4" opacity=".8"/>`:""}
    <path d="${path}" fill="none" stroke="${G.c1}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(t)}" cy="${Y(spent)}" r="4.5" fill="${over?"var(--alert)":G.c1}" stroke="var(--surface)" stroke-width="2"/>
    ${[1,10,20,dim].map(d=>`<text x="${X(d)}" y="${H-6}" text-anchor="middle">${d}</text>`).join("")}
    <line id="paceX" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--ink)" stroke-width="1" opacity="0"/>
    <rect x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent" data-pace="1"/>
  </svg>`;
  window._pace={cum,dim,t,B,X,pl,W,pr};

  // 2. où part l'argent
  const inc=C.salaryTot+C.recvTot+C.extraTot, other=C.spentAll-C.spentCourses;
  const parts=[{n:"Prélèvements",v:C.fixed,c:G.c1},{n:"Courses",v:C.spentCourses,c:G.c2},{n:"Autres dépenses",v:other,c:G.c4}];
  if(C.projSpentM>0) parts.push({n:"Projets anticipés",v:C.projSpentM,c:G.c3});
  const used=parts.reduce((s,p)=>s+p.v,0), rest=inc-used;
  if(rest>0) parts.push({n:"Reste",v:rest,c:G.rest});
  const base=Math.max(inc,used)||1;
  const split=`<div class="stack">${parts.filter(p=>p.v>0).map(p=>`<i style="flex:${p.v} 0 0;background:${p.c}" ${tipAttr(p.n+" : "+eur(p.v)+" ("+Math.round(p.v/base*100)+" %)")}></i>`).join("")}</div>
    <div class="legend">${parts.map(p=>`<div><span class="sw" style="background:${p.c}"></span><span class="n">${p.n}</span><span class="a">${eur0(p.v)}<small>${Math.round(p.v/base*100)} %</small></span></div>`).join("")}
    ${rest<0?`<div><span class="sw" style="background:var(--alert)"></span><span class="n" style="color:var(--alert);font-weight:600">Manque</span><span class="a" style="color:var(--alert)">${eur0(-rest)}</span></div>`:""}</div>`;

  // 3. catégories
  const rows=Object.keys(C.byCat).map(id=>({c:cat(id),v:C.byCat[id]})).filter(r=>r.v>0.5).sort((a,b)=>b.v-a.v);
  const cmax=Math.max(1,...rows.map(r=>Math.max(r.v,+r.c.budget||0)));
  const cats=rows.map(r=>{ const b=+r.c.budget||0, ov=b&&r.v>b;
    return `<div class="cbar" ${tipAttr(r.c.name+" : "+eur(r.v)+(b?" sur "+eur0(b):""))}><div class="h"><span>${esc(r.c.name)}</span><span class="a" style="${ov?"color:var(--alert)":""}">${eur0(r.v)}${b?` <small>/ ${eur0(b)}</small>`:""}</span></div>
      <div class="t"><i class="${ov?"over":""}" data-w="${(r.v/cmax*100).toFixed(1)}"></i>${b?`<b style="left:calc(${(b/cmax*100).toFixed(1)}% - 1px)"></b>`:""}</div></div>`; }).join("");

  // 4. mois par mois
  const hist=monthsWithData().slice(-6).map(ym=>{ const c=calc(ym); return {ym,inc:c.salaryTot+c.recvTot+c.extraTot,out:c.fixed+c.spentAll+c.projSpentM,res:c.salaryTot+c.recvTot+c.extraTot-c.fixed-c.spentAll-c.projSpentM}; });
  let monthsChart="";
  if(hist.length){ const W2=340,H2=150,top=18,bot=22, mx=Math.max(50,...hist.map(h=>Math.abs(h.res)));
    const neg=hist.some(h=>h.res<0), pos=hist.some(h=>h.res>0);
    const zero=pos&&neg?top+(H2-top-bot)/2:pos?H2-bot:top, sc=(pos&&neg?(H2-top-bot)/2:(H2-top-bot))/mx;
    const bw=Math.min(38,(W2-20)/hist.length-12), step=(W2-20)/hist.length;
    monthsChart=`<svg class="chart" viewBox="0 0 ${W2} ${H2}" role="img" aria-label="Résultat des derniers mois">
      <line x1="6" x2="${W2-6}" y1="${zero}" y2="${zero}" stroke="var(--ink)" stroke-width="1"/>
      ${hist.map((h,i)=>{ const x=10+i*step+(step-bw)/2, hgt=Math.max(2,Math.abs(h.res)*sc), y=h.res>=0?zero-hgt:zero, col=h.res>=0?"var(--teal)":"var(--alert)";
        const lblY=h.res>=0?y-5:y+hgt+12, ab=MSHORT[ymParts(h.ym).m-1];
        return `<g ${tipAttr(MONTHS[ymParts(h.ym).m-1]+" · rentrées "+eur0(h.inc)+" · sorties "+eur0(h.out)+" · résultat "+eur0(h.res))}>
          <rect x="${x-4}" y="0" width="${bw+8}" height="${H2}" fill="transparent"/>
          <rect x="${x}" y="${y}" width="${bw}" height="${hgt}" rx="4" fill="${col}" opacity="${h.ym===ymNow()?0.45:1}"/>
          <text class="lbl" x="${x+bw/2}" y="${lblY}" text-anchor="middle" style="fill:${h.res>=0?"var(--teal)":"var(--alert)"}">${h.res>=0?"+":""}${nf0.format(Math.round(h.res))}</text>
          <text x="${x+bw/2}" y="${H2-5}" text-anchor="middle">${ab}${h.ym===ymNow()?" *":""}</text></g>`; }).join("")}
    </svg>
    <div class="calc" style="margin-top:6px">${hist.slice().reverse().map(h=>`<div class="l"><span class="n" style="text-transform:capitalize">${MONTHS[ymParts(h.ym).m-1]}<small>${h.ym===ymNow()?"en cours · ":""}rentrées ${eur0(h.inc)} · sorties ${eur0(h.out)}</small></span><span class="a ${h.res<0?"minus":"plus"}">${h.res>=0?"+":""}${eur0(h.res)}</span></div>`).join("")}</div>`; }

  // 5. épargne
  const sv=Object.keys(S.months).sort().filter(ym=>ym<=ymNow()); let run=S.savings.reduce((a,x)=>a+(+x.initial||0),0);
  const spts=sv.map(ym=>{ S.months[ym].moves.forEach(mv=>run+=(mv.kind==="in"?1:-1)*(+mv.amount||0)); return {ym,v:run}; });
  let savChart="";
  if(S.savings.length && spts.length){ const W3=340,H3=120,p3=34, lo=Math.min(...spts.map(p=>p.v))*0.9, hi=Math.max(...spts.map(p=>p.v))*1.05||1;
    const X3=i=>p3+(spts.length===1?0.5:i/(spts.length-1))*(W3-p3-14), Y3=v=>10+(1-(v-lo)/((hi-lo)||1))*(H3-34);
    savChart=`<svg class="chart" viewBox="0 0 ${W3} ${H3}" role="img" aria-label="Évolution de l'épargne">
      <line x1="${p3}" x2="${W3-6}" y1="${H3-24}" y2="${H3-24}" stroke="var(--line)"/>
      <path d="${spts.map((p,i)=>(i?"L":"M")+X3(i).toFixed(1)+","+Y3(p.v).toFixed(1)).join("")}" fill="none" stroke="${G.c3}" stroke-width="2.2" stroke-linejoin="round"/>
      ${spts.map((p,i)=>`<g ${tipAttr(MONTHS[ymParts(p.ym).m-1]+" : "+eur(p.v))}><circle cx="${X3(i)}" cy="${Y3(p.v)}" r="14" fill="transparent"/><circle cx="${X3(i)}" cy="${Y3(p.v)}" r="4.5" fill="${G.c3}" stroke="var(--surface)" stroke-width="2"/>
        <text x="${X3(i)}" y="${H3-8}" text-anchor="middle">${MSHORT[ymParts(p.ym).m-1]}</text>
        ${i===spts.length-1||i===0?`<text class="lbl" x="${X3(i)}" y="${Y3(p.v)-9}" text-anchor="middle">${nf0.format(Math.round(p.v))}</text>`:""}</g>`).join("")}
    </svg>`; }

  return `
  <div class="card">
    <span class="eyebrow">Rythme des dépenses · ${esc(mName)}</span>
    <div class="stat">
      <div><span class="eyebrow">Dépensé${isNow?" au "+t:""}</span><div class="v" style="${over?"color:var(--alert)":""}">${eur0(spent)}</div></div>
      <div><span class="eyebrow">${isNow?"Prévu à ce jour":"Budget du mois"}</span><div class="v" style="color:var(--ink-2)">${eur0(isNow?ideal:B)}</div></div>
    </div>
    ${pace}
    <div class="hint" style="margin-top:6px">Trait plein : tes dépenses cumulées (hors prélèvements). Pointillés gris : le rythme qui tient le budget de ${eur0(B)}.${isNow&&t>=3&&t<dim?` À ce rythme, fin de mois à <b style="color:${over?"var(--alert)":"var(--ink-2)"}">${eur0(proj)}</b>.`:""} Touche le graphique pour voir un jour précis.</div>
  </div>
  <div class="card">
    <span class="eyebrow">Où part l'argent du mois</span>
    <div class="stat"><div><span class="eyebrow">Rentrées</span><div class="v">${eur0(inc)}</div></div>
      <div><span class="eyebrow">${rest>=0?"Il reste":"Il manque"}</span><div class="v" style="color:${rest>=0?"var(--teal)":"var(--alert)"}">${eur0(Math.abs(rest))}</div></div></div>
    ${split}
  </div>
  <div class="card">
    <span class="eyebrow">Dépenses par catégorie</span>
    ${cats||`<div class="empty">Pas encore de dépense ce mois.</div>`}

(function(){ const tip=document.getElementById("tip"); let h=null;
  const show=(txt,x,y)=>{ tip.textContent=txt; tip.classList.add("on"); const r=tip.getBoundingClientRect();
    tip.style.left=Math.max(8,Math.min(innerWidth-r.width-8,x-r.width/2))+"px"; tip.style.top=Math.max(8,y-r.height-14)+"px"; clearTimeout(h); h=setTimeout(()=>tip.classList.remove("on"),2600); };
  const pace=(e)=>{ const P=window._pace, svg=document.getElementById("paceSvg"); if(!P||!svg) return false;
    const r=svg.getBoundingClientRect(), vx=(e.clientX-r.left)/r.width*P.W; let d=Math.round((vx-P.pl)/(P.W-P.pl-P.pr)*(P.dim-1))+1; d=Math.max(1,Math.min(P.t,d));
    const ln=document.getElementById("paceX"); ln.setAttribute("x1",P.X(d)); ln.setAttribute("x2",P.X(d)); ln.setAttribute("opacity",".35");
    show(`Jour ${d} : ${eur0(P.cum[d])} dépensés${P.B?` · prévu ${eur0(P.B*d/P.dim)}`:""}`,e.clientX,r.top+10); return true; };
  document.addEventListener("pointerdown",e=>{ const p=e.target.closest("[data-pace]"); if(p){ pace(e); return; }
    const t=e.target.closest("[data-tip]"); if(t){ show(t.dataset.tip,e.clientX,e.clientY); } else tip.classList.remove("on"); });
  document.addEventListener("pointermove",e=>{ if(e.target.closest&&e.target.closest("[data-pace]")) pace(e); });
})();

/* ---------- Le fil ---------- */
function filFor(aid){ filFilter=aid; tab="fil"; render(); }
function setFil(f){ filFilter=f; render(); }
function vFil(){
  const M=month(cur), C=calc(cur);
  let ops=M.ops.slice();
  if(filFilter==="pending") ops=ops.filter(o=>!o.seen);
  else if(filFilter!=="all") ops=ops.filter(o=>o.account===filFilter);
  if(filFilter!=="pending"){
    M.transfers.filter(t=>t.done&&(filFilter==="all"||t.from===filFilter||t.to===filFilter)).forEach(t=>ops.push({_t:"tr",id:t.id,day:t.day||1,amount:t.amount,from:t.from,to:t.to,label:t.label}));
    M.moves.filter(m=>filFilter==="all"||m.account===filFilter).forEach(m=>ops.push({_t:"mv",id:m.id,day:m.day||1,amount:m.amount,kind:m.kind,account:m.account,savingsId:m.savingsId,label:m.label}));
  }
  ops.sort((a,b)=>(b.day||0)-(a.day||0)||(b.ts||0)-(a.ts||0));
  const byDay={}; ops.forEach(o=>{ (byDay[o.day]=byDay[o.day]||[]).push(o); });
  const days=Object.keys(byDay).map(Number).sort((a,b)=>b-a);
  const {y,m}=ymParts(cur);
  const dayName=d=>DAYS[new Date(y,m-1,d).getDay()];
  const opRow=o=>{
    if(o._t==="tr") return `<div class="row"><span class="chk on" style="background:var(--indigo);border-color:var(--indigo)">⇄</span>
      <div class="body" onclick="editTransfer('${o.id}')"><div class="t">${esc(o.label||"Virement interne")}</div><div class="s">${esc(accName(o.from))} → ${esc(accName(o.to))}</div></div>
      <div class="amt" style="color:var(--indigo)" onclick="editTransfer('${o.id}')">${eur(o.amount)}</div></div>`;
    if(o._t==="mv"){ const sv=(S.savings.find(x=>x.id===o.savingsId)||{}).name||"Épargne";
      return `<div class="row"><span class="chk on" style="background:var(--teal);border-color:var(--teal)">◈</span>
      <div class="body" onclick="editMove('${o.id}')"><div class="t">${esc(o.label||(o.kind==="in"?"Mise de côté":"Retrait"))}</div><div class="s">${o.kind==="in"?esc(accName(o.account))+" → "+esc(sv):esc(sv)+" → "+esc(accName(o.account))}</div></div>
      <div class="amt" style="color:var(--teal)" onclick="editMove('${o.id}')">${eur(o.amount)}</div></div>`; }
    const c=cat(o.category), target=o.refundOf?M.ops.find(x=>x.id===o.refundOf):null;
    const sub = o.kind==="in"
      ? (target?`remboursement · ${esc(target.label||cat(target.category).name)}`:`rentrée`)
      : `${esc(c.name)}${c.pocket==="courses"?" · courses":c.pocket==="repas"?" · panier":""}${c.refund?(o._refunded>0?` · remboursé ${eur0(o._refunded)} / ${eur0(o.amount)}`:" · remboursable"):""}`;
    return `<div class="row">
      <button class="chk ${o.seen?"on":""}" onclick="toggleSeen('${o.id}')" aria-label="Vu à la banque">✓</button>
      <div class="body" onclick="editOp('${o.id}')"><div class="t">${esc(o.label||c.name)}</div>
        <div class="s"><span class="dot" style="background:${accColor(o.account)}"></span>${esc(accName(o.account))} · ${sub}</div></div>
      <div class="amt" onclick="editOp('${o.id}')" style="color:${o.kind==="in"?"var(--teal)":o.seen?"inherit":"var(--amber)"}">${o.kind==="in"?"+":"−"}${eur(o.amount)}</div>
    </div>`;
  };
  return `
  <div class="tabs">
    <button class="${filFilter==="all"?"on":""}" onclick="setFil('all')">Tout</button>
    ${S.accounts.map(a=>`<button class="${filFilter===a.id?"on":""}" onclick="setFil('${a.id}')"><span class="dot" style="background:${accColor(a.id)}"></span>${esc(a.name)}</button>`).join("")}
    <button class="${filFilter==="pending"?"on":""}" onclick="setFil('pending')">En attente${C.nPending?" · "+C.nPending:""}</button>
  </div>
  ${C.nPending?`<div class="banner info" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span>${C.nPending} opération${C.nPending>1?"s":""} pas encore vue${C.nPending>1?"s":""} à la banque (${eur0(C.pendingTot)}).</span><button class="act" style="color:var(--teal);font-weight:600;flex:none" onclick="markAllSeen()">Tout pointer</button></div>`:``}
  <div class="card">
    ${days.length? days.map(d=>`<div class="daylabel">${dayName(d)} ${d}</div>${byDay[d].map(opRow).join("")}`).join("")
      : `<div class="empty"><b>Rien pour l'instant.</b>Le bouton + ajoute une dépense en trois gestes : montant, compte, catégorie.</div>`}
  </div>`;
}

/* ---------- Bilan du mois ---------- */
function bilanCard(C){
  const pym=ymShift(cur,-1), PM=S.months[pym], P=(PM&&PM.ops.length&&PM.salary.some(s=>(+s.amount||0)>0))?calc(pym):null, pName=MONTHS[ymParts(pym).m-1];
  const inc=C.salaryTot+C.recvTot+C.extraTot, res=inc-C.fixed-C.spentAll-C.projSpentM;
  const ids=Object.keys(C.byCat).concat(P?Object.keys(P.byCat):[]).filter((v,i,a)=>a.indexOf(v)===i);
  const rows=ids.map(id=>({id,v:C.byCat[id]||0,p:P?(P.byCat[id]||0):null})).filter(r=>r.v>0.5||(r.p||0)>0.5).sort((a,b)=>b.v-a.v||b.p-a.p);
  return `<div class="card">
    <div class="sec"><span class="eyebrow">Bilan du mois</span></div>
    <div class="calc">
      <div class="l"><span class="n">Rentrées<small>salaire, sommes reçues et autres rentrées, hors remboursements</small></span><span class="a plus">${eur(inc)}</span></div>
      <div class="l"><span class="n">Prélèvements</span><span class="a minus">−${eur(C.fixed)}</span></div>
      <div class="l"><span class="n">Dépenses<small>nettes des remboursements, sans les virements entre comptes</small></span><span class="a minus">−${eur(C.spentAll)}</span></div>
      ${C.projSpentM>0?`<div class="l"><span class="n">Projets anticipés<small>payés avec l'argent mis de côté</small></span><span class="a minus">−${eur(C.projSpentM)}</span></div>`:""}
      <div class="l res"><span class="n">Résultat${P?`<small>${pName} : ${eur0(P.salaryTot+P.recvTot+P.extraTot-P.fixed-P.spentAll)}</small>`:""}</span><span class="a ${res<0?"minus":"plus"}">${res>=0?"+":""}${eur(res)}</span></div>
      ${rows.length?`<div class="l head"><span class="n">Par catégorie</span>${P?`<span class="n" style="font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3)">VS ${esc(pName.toUpperCase())}</span>`:""}</div>`:""}
      ${rows.map(r=>{ const c=cat(r.id), b=+c.budget||0, d=r.p==null?null:r.v-r.p;
        return `<div class="l"><span class="n">${esc(c.name)}<small>${b?`plafond ${eur0(b)}${r.v>b?` · <span style="color:var(--alert)">dépassé</span>`:""}`:"sans plafond"}</small></span>
          <span class="a">${eur0(r.v)}${d!=null&&Math.abs(d)>=1?` <small style="font-weight:500;color:${d>0?"var(--alert)":"var(--teal)"}">${d>0?"+":"−"}${eur0(Math.abs(d))}</small>`:""}</span></div>`; }).join("")}
    </div>
  </div>`;
}
